function getOrCreateDatabaseSpreadsheet() {
  const props = PropertiesService.getScriptProperties();
  let ssId = props.getProperty(PROP_SPREADSHEET_ID);
  let ss = null;

  if (ssId) {
    try {
      ss = SpreadsheetApp.openById(ssId);
    } catch (err) {
      ss = null;
    }
  }

  if (!ss) {
    ss = SpreadsheetApp.create(DEFAULT_SPREADSHEET_TITLE);
    props.setProperty(PROP_SPREADSHEET_ID, ss.getId());
  }

  Object.keys(SHEETS_SCHEMA).forEach(function(sheetName) {
    let sheet = ss.getSheetByName(sheetName);
    if (!sheet) {
      sheet = ss.insertSheet(sheetName);
    }
    const headers = SHEETS_SCHEMA[sheetName];
    if (sheet.getLastRow() === 0) {
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
      sheet.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#002b7a').setFontColor('#ffffff');
      sheet.setFrozenRows(1);
    }
  });

  const defaultSheet = ss.getSheetByName('Sheet1');
  if (defaultSheet && ss.getSheets().length > 1) {
    ss.deleteSheet(defaultSheet);
  }

  return ss;
}

function readSheetAsObjects(sheet, headers) {
  const lastRow = sheet.getLastRow();
  if (lastRow < 2) return [];
  const values = sheet.getRange(2, 1, lastRow - 1, headers.length).getValues();
  return values
    .filter(function(row) { return row[0] !== '' && row[0] !== null; })
    .map(function(row) {
      const obj = {};
      headers.forEach(function(key, idx) {
        obj[key] = row[idx];
      });
      return obj;
    });
}

function upsertRow(sheet, headers, record) {
  const id = String(record.id || '').trim();
  if (!id) return;
  const lastRow = sheet.getLastRow();
  let targetRow = -1;

  if (lastRow >= 2) {
    const ids = sheet.getRange(2, 1, lastRow - 1, 1).getValues();
    for (let i = 0; i < ids.length; i++) {
      if (String(ids[i][0]).trim() === id) {
        targetRow = i + 2;
        break;
      }
    }
  }

  const rowValues = headers.map(function(key) {
    const val = record[key];
    if (val === undefined || val === null) return '';
    if (typeof val === 'object') return JSON.stringify(val);
    return val;
  });

  if (targetRow > 0) {
    sheet.getRange(targetRow, 1, 1, headers.length).setValues([rowValues]);
  } else {
    sheet.appendRow(rowValues);
  }
}

function deleteRowById(sheet, id) {
  const cleanId = String(id || '').trim();
  const lastRow = sheet.getLastRow();
  if (!cleanId || lastRow < 2) return;
  const ids = sheet.getRange(2, 1, lastRow - 1, 1).getValues();
  for (let i = ids.length - 1; i >= 0; i--) {
    if (String(ids[i][0]).trim() === cleanId) {
      sheet.deleteRow(i + 2);
    }
  }
}

function jsonResponse(obj) {
  return ContentService
    .createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  try {
    const ss = getOrCreateDatabaseSpreadsheet();
    const result = { ok: true, spreadsheetUrl: ss.getUrl(), data: {} };
    Object.keys(TABLE_TO_SHEET).forEach(function(tableKey) {
      const sheetName = TABLE_TO_SHEET[tableKey];
      const sheet = ss.getSheetByName(sheetName);
      result.data[tableKey] = readSheetAsObjects(sheet, SHEETS_SCHEMA[sheetName]);
    });
    return jsonResponse(result);
  } catch (err) {
    return jsonResponse({ ok: false, error: String(err) });
  }
}

function doPost(e) {
  try {
    const ss = getOrCreateDatabaseSpreadsheet();
    const payload = JSON.parse(e.postData.contents || '{}');
    const action = payload.action || 'init';

    if (action === 'init') {
      return jsonResponse({ ok: true, spreadsheetUrl: ss.getUrl() });
    }

    if (action === 'upsert') {
      const sheetName = TABLE_TO_SHEET[payload.table];
      if (!sheetName) return jsonResponse({ ok: false, error: 'Tabel tidak dikenal' });
      upsertRow(ss.getSheetByName(sheetName), SHEETS_SCHEMA[sheetName], payload.data || {});
      return jsonResponse({ ok: true });
    }

    if (action === 'batchUpsert') {
      const items = Array.isArray(payload.items) ? payload.items : [];
      items.forEach(function(item) {
        const sheetName = TABLE_TO_SHEET[item.table];
        if (sheetName) {
          upsertRow(ss.getSheetByName(sheetName), SHEETS_SCHEMA[sheetName], item.data || {});
        }
      });
      return jsonResponse({ ok: true });
    }

    if (action === 'delete') {
      const sheetName = TABLE_TO_SHEET[payload.table];
      if (!sheetName) return jsonResponse({ ok: false, error: 'Tabel tidak dikenal' });
      deleteRowById(ss.getSheetByName(sheetName), payload.id);
      return jsonResponse({ ok: true });
    }

    return jsonResponse({ ok: false, error: 'Aksi tidak didukung' });
  } catch (err) {
    return jsonResponse({ ok: false, error: String(err) });
  }
}`;

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderMathHtml(rawText, preserveNewlines = true) {
      if (rawText === null || rawText === undefined) return '';
      const str = String(rawText);
      const mathRegex = /\$\$([\s\S]+?)\$\$|\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g;
      let result = '';
      let lastIndex = 0;
      let match;

      while ((match = mathRegex.exec(str)) !== null) {
        const plainPart = escapeHtml(str.slice(lastIndex, match.index));
        result += preserveNewlines ? plainPart.replace(/\n/g, '<br/>') : plainPart;

        const isDisplay = match[1] !== undefined;
        const latexExpr = isDisplay ? match[1] : match[2];

        if (window.katex && typeof window.katex.renderToString === 'function') {
          try {
            result += window.katex.renderToString(latexExpr, {
              displayMode: isDisplay,
              throwOnError: false,
              output: 'html',
            });
          } catch {
            result += escapeHtml(match[0]);
          }
        } else {
          result += escapeHtml(match[0]);
        }
        lastIndex = mathRegex.lastIndex;
      }

      const rest = escapeHtml(str.slice(lastIndex));
      result += preserveNewlines ? rest.replace(/\n/g, '<br/>') : rest;
      return result;
    }

    function convertLatexExprToWordHtml(latexExpr) {
      let expr = String(latexExpr || '').trim();
      expr = expr.replace(/\\left\s*/g, '').replace(/\\right\s*/g, '');

      for (let i = 0; i < 4; i++) {
        expr = expr.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, (_, num, den) => {
          const cleanNum = num.trim();
          const cleanDen = den.trim();
          if (cleanNum.length <= 12 && cleanDen.length <= 12 && !/[+\-]/.test(cleanNum.slice(1)) && !/[+\-]/.test(cleanDen.slice(1))) {
            return `<sup>${cleanNum}</sup>&frasl;<sub>${cleanDen}</sub>`;
          }
          return `(${cleanNum})/(${cleanDen})`;
        });
      }

      expr = expr.replace(/\\sqrt\s*\[([^\]]+)\]\s*\{([^{}]+)\}/g, '<sup>$1</sup>&radic;<span style="text-decoration:overline;">$2</span>');
      expr = expr.replace(/\\sqrt\s*\{([^{}]+)\}/g, '&radic;<span style="text-decoration:overline;">$1</span>');

      expr = expr.replace(/\^\s*\{([^{}]+)\}/g, '<sup>$1</sup>');
      expr = expr.replace(/\^([A-Za-z0-9])/g, '<sup>$1</sup>');
      expr = expr.replace(/_\s*\{([^{}]+)\}/g, '<sub>$1</sub>');
      expr = expr.replace(/_([A-Za-z0-9])/g, '<sub>$1</sub>');

      const symbolMap = [
        [/\\pm/g, '&plusmn;'],
        [/\\mp/g, '&#8723;'],
        [/\\times/g, '&times;'],
        [/\\cdot/g, '&middot;'],
        [/\\div/g, '&divide;'],
        [/\\le(?:q)?/g, '&le;'],
        [/\\ge(?:q)?/g, '&ge;'],
        [/\\ne(?:q)?/g, '&ne;'],
        [/\\approx/g, '&asymp;'],
        [/\\equiv/g, '&equiv;'],
        [/\\infty/g, '&infin;'],
        [/\\pi/g, '&pi;'],
        [/\\theta/g, '&theta;'],
        [/\\alpha/g, '&alpha;'],
        [/\\beta/g, '&beta;'],
        [/\\gamma/g, '&gamma;'],
        [/\\Delta/g, '&Delta;'],
        [/\\delta/g, '&delta;'],
        [/\\sigma/g, '&sigma;'],
        [/\\mu/g, '&mu;'],
        [/\\lambda/g, '&lambda;'],
        [/\\sum/g, '&sum;'],
        [/\\prod/g, '&prod;'],
        [/\\int/g, '&int;'],
        [/\\circ/g, '&deg;'],
        [/\\rightarrow|\\to/g, '&rarr;'],
        [/\\leftarrow/g, '&larr;'],
        [/\\Rightarrow/g, '&rArr;'],
        [/\\Leftrightarrow/g, '&hArr;'],
        [/\\in/g, '&isin;'],
        [/\\notin/g, '&notin;'],
        [/\\subset/g, '&sub;'],
        [/\\cup/g, '&cup;'],
        [/\\cap/g, '&cap;'],
        [/\\,|\\;|\\:|\\!/g, ' '],
      ];

      symbolMap.forEach(([regex, replacement]) => {
        expr = expr.replace(regex, replacement);
      });

      expr = expr.replace(/\\([a-zA-Z]+)/g, '$1');
      return expr;
    }

    function renderMathForWordHtml(rawText, preserveNewlines = false) {
      if (rawText === null || rawText === undefined) return '';
      const str = String(rawText);
      const mathRegex = /\$\$([\s\S]+?)\$\$|\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g;
      let result = '';
      let lastIndex = 0;
      let match;

      while ((match = mathRegex.exec(str)) !== null) {
        const plainPart = escapeHtml(str.slice(lastIndex, match.index));
        result += preserveNewlines ? plainPart.replace(/\n/g, '<br/>') : plainPart;

        const isDisplay = match[1] !== undefined;
        const latexExpr = isDisplay ? match[1] : match[2];
        const converted = convertLatexExprToWordHtml(latexExpr);

        if (isDisplay) {
          result += `<div style="text-align: center; margin: 6px 0; font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 10.5pt;">${converted}</div>`;
        } else {
          result += `<span style="font-family: 'Cambria Math', 'Times New Roman', serif;">${converted}</span>`;
        }
        lastIndex = mathRegex.lastIndex;
      }

      const rest = escapeHtml(str.slice(lastIndex));
      result += preserveNewlines ? rest.replace(/\n/g, '<br/>') : rest;
      return result;
    }

    function handleStimulusImageUpload(inputEl) {
      const file = inputEl?.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Pilih file gambar yang valid (PNG, JPG, atau WebP).', 'error', 'Format Tidak Didukung');
        return;
      }
      const reader = new FileReader();
      reader.onload = function (evt) {
        const img = new Image();
        img.onload = function () {
          const compressWithParams = (maxWidth, quality) => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            let dataUrl = canvas.toDataURL('image/webp', quality);
            if (!dataUrl.startsWith('data:image/webp')) {
              dataUrl = canvas.toDataURL('image/jpeg', quality);
            }
            return dataUrl;
          };

          let compressed = compressWithParams(720, 0.75);
          if (compressed.length > 42000) {
            compressed = compressWithParams(520, 0.6);
          }
          if (compressed.length > 48000) {
            showToast(
              'Ukuran gambar terlalu kompleks untuk sel Spreadsheet. Gunakan URL gambar eksternal atau gambar yang lebih sederhana.',
              'warning',
              'Ukuran Gambar Besar'
            );
            return;
          }
          state.qForm.stimulusImage = compressed;
          renderApp();
          showToast('Gambar stimulus berhasil dikompresi dan siap disimpan!');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function formatCountdown(totalSec) {
      const safe = Math.max(0, Math.floor(Number(totalSec) || 0));
      const hrs = Math.floor(safe / 3600);
      const mins = Math.floor((safe % 3600) / 60);
      const secs = safe % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return hrs > 0 ? `${pad(hrs)}:${pad(mins)}:${pad(secs)}` : `${pad(mins)}:${pad(secs)}`;

    function generateUniqueToken(existingTokens, subject = '') {
      const prefixClean = String(subject || 'TKA')
        .replace(/[^A-Za-z]/g, '')
        .toUpperCase()
        .slice(0, 3)
        .padEnd(3, 'X');
      const set = new Set((existingTokens || []).map((t) => String(t || '').trim().toUpperCase()));
      for (let attempt = 0; attempt < 100; attempt++) {
        const num = Math.floor(100 + Math.random() * 900);
        const candidate = `${prefixClean}${num}`;
        if (!set.has(candidate)) return candidate;
      }
      return `${prefixClean}${Date.now().toString().slice(-3)}`;
    }

    async function callGeminiTkaJson(systemPrompt, userPrompt, responseSchema) {
      let serverErrorMessage = '';

      // 1. Panggil Server Vercel (/api/gemini) — aktif di semua perangkat & mode Samaran
      if (window.location.protocol.startsWith('http')) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 55000);
          const serverRes = await fetch('/api/gemini', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({ systemPrompt, userPrompt, responseSchema }),
          });
          clearTimeout(timeoutId);

          const contentType = serverRes.headers.get('content-type') || '';
          if (contentType.includes('application/json')) {
            const serverData = await serverRes.json();
            if (serverRes.ok && serverData && serverData.ok && serverData.result) {
              return serverData.result;
            }
            if (serverData && serverData.error) {
              serverErrorMessage = serverData.error;
            }
          } else {
            serverErrorMessage = `Server /api/gemini merespons HTTP ${serverRes.status}`;
          }
        } catch (netErr) {
          serverErrorMessage = netErr?.message || 'Gagal menjangkau /api/gemini';
        }
      }

      // 2. Cadangan: Panggil langsung menggunakan API Key lokal browser jika tersedia
      const apiKey = getStoredGeminiApiKey();
      if (!apiKey) {
        throw new Error(
          serverErrorMessage ||
            'API Key Gemini belum terpasang di Vercel (GEMINI_API_KEY) maupun pengaturan lokal.'
        );
      }

      const models = ['gemini-2.5-flash', 'gemini-2.0-flash'];
      let lastErr = null;

      for (let mIdx = 0; mIdx < models.length; mIdx++) {
        const modelName = models[mIdx];
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 28000);

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
              contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: {
                temperature: 0.75,
                responseMimeType: 'application/json',
                responseSchema,
              },
            }),
          });
          if (!res.ok) {
            const errJson = await res.json().catch(() => ({}));
            lastErr = new Error(errJson?.error?.message || `HTTP ${res.status}`);
            if (res.status === 404 && mIdx < models.length - 1) continue;
            throw lastErr;
          }
          const data = await res.json();
          const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text ?? data?.text ?? '';
          return typeof rawText === 'string' ? JSON.parse(rawText) : rawText;
        } catch (err) {
          lastErr = err;
          if (mIdx === models.length - 1) throw lastErr;
        } finally {
          clearTimeout(timeoutId);
        }
      }
      throw lastErr || new Error('Gagal terhubung ke Gemini AI.');
    }

    function evaluateOptionBalance(options) {
      const clean = (Array.isArray(options) ? options : [])
        .map((o) => String(o || '').trim())
        .filter((o) => o !== '');
      if (clean.length < 2) {
        return { isBalanced: true, maxVariancePercent: 0 };
      }
      const lengths = clean.map((o) => o.length);
      const maxLen = Math.max(...lengths);
      const minLen = Math.min(...lengths);
      const variance = maxLen > 0 ? Math.round(((maxLen - minLen) / maxLen) * 100) : 0;
      return {
        isBalanced: variance <= 15,
        maxVariancePercent: variance,
      };
    }

    function harmonizeGeneratedOptions(options) {
      return (Array.isArray(options) ? options : []).map((opt) =>
        String(opt || '')
          .replace(/\s+/g, ' ')
          .trim()
      );
    }

    function distributeGeneratedOptionKeys(items) {
      if (!Array.isArray(items)) return [];
      return items.map((item, idx) => {
        if (item.questionType !== 'PG' || !Array.isArray(item.options) || item.options.length < 2) {
          return item;
        }
        const opts = [...item.options];
        const currentKeyIdx =
          typeof item.correctPgIndex === 'number' && item.correctPgIndex >= 0 && item.correctPgIndex < opts.length
            ? item.correctPgIndex
            : 0;
        const targetKeyIdx = (idx * 2 + 1) % opts.length;
        if (currentKeyIdx !== targetKeyIdx) {
          const temp = opts[targetKeyIdx];
          opts[targetKeyIdx] = opts[currentKeyIdx];
          opts[currentKeyIdx] = temp;
        }
        return {
          ...item,
          options: opts,
          correctPgIndex: targetKeyIdx,
        };
      });
    }

    function normalizeQuestionRecord(raw) {
      let options = [];
      let correctAnswer = 0;
      let analysis = null;

      try {
        options = Array.isArray(raw.options)
          ? raw.options
          : raw.optionsJson
          ? JSON.parse(raw.optionsJson)
          : [];
      } catch {
        options = [];
      }

      try {
        correctAnswer =
          raw.correctAnswer !== undefined
            ? raw.correctAnswer
            : raw.correctAnswerJson !== undefined && raw.correctAnswerJson !== ''
            ? JSON.parse(raw.correctAnswerJson)
            : 0;
      } catch {
        correctAnswer = 0;
      }

      try {
        analysis =
          raw.analysis && typeof raw.analysis === 'object'
            ? raw.analysis
            : raw.analysisJson
            ? JSON.parse(raw.analysisJson)
            : null;
      } catch {
        analysis = null;
      }

      return {
        ...raw,
        stimulusImage: String(raw.stimulusImage || '').trim(),
        stimulusCaption: String(raw.stimulusCaption || '').trim(),
        options,
        correctAnswer,
        weight: Number(raw.weight) || 20,
        order: Number(raw.order) || 1,
        optionBalance: evaluateOptionBalance(options),
        analysis,
      };
    }

    function deduplicateSessionsList(sessions) {
      const map = new Map();
      (Array.isArray(sessions) ? sessions : []).forEach((s) => {
        let tpBreakdown = [];
        let answers = {};
        try {
          tpBreakdown = Array.isArray(s.tpBreakdown)
            ? s.tpBreakdown
            : s.tpBreakdownJson
            ? JSON.parse(s.tpBreakdownJson)
            : [];
        } catch {
          tpBreakdown = [];
        }
        try {
          answers =
            s.answers && typeof s.answers === 'object'
              ? s.answers
              : s.answersJson
              ? JSON.parse(s.answersJson)
              : {};
        } catch {
          answers = {};
        }

        const normalized = {
          ...s,
          score: Number(s.score) || 0,
          passed: s.passed === true || String(s.passed).toLowerCase() === 'true',
          tpBreakdown,
          answers,
        };
        const key = `${String(s.nisn || '').trim().toLowerCase()}__${String(s.teacherId || '').trim().toLowerCase()}`;
        const prev = map.get(key);
        if (!prev || (normalized.status === 'selesai' && prev.status !== 'selesai')) {
          map.set(key, normalized);
        }
      });
      return Array.from(map.values());
    }

    function mergeTeachersWithSeeds(incomingTeachers) {
      const list = Array.isArray(incomingTeachers)
        ? incomingTeachers.map((t) => ({
            ...t,
            username: String(t.username || '').trim(),
            password: String(t.password || '').trim(),
            token: String(t.token || '').trim().toUpperCase(),
            durationMinutes: Number(t.durationMinutes) || 60,
            targetQuestionCount: Number(t.targetQuestionCount) || 5,
            dailyQuestionLimit: t.dailyQuestionLimit !== undefined && t.dailyQuestionLimit !== null && String(t.dailyQuestionLimit).trim() !== ''
              ? Math.max(0, Number(t.dailyQuestionLimit) || 0)
              : 20,
            examOpen: t.examOpen !== false && String(t.examOpen).toLowerCase() !== 'false',
          }))
        : [];
      SEED_TEACHERS.forEach((seed) => {
        const exists = list.some(
          (t) =>
            String(t.id || '').trim() === seed.id ||
            String(t.username || '').trim().toLowerCase() === seed.username.toLowerCase()
        );
        if (!exists) {
          list.push({ ...seed });
        }
      });
      return list;
    }

    function restoreActiveViewSessionOnReload() {
      try {
        const raw = localStorage.getItem(ACTIVE_VIEW_SESSION_STORAGE_KEY);
        if (!raw) return false;
        const saved = JSON.parse(raw);
        if (!saved || !saved.currentView) return false;

        if (saved.currentView === 'proktor' && saved.activeTeacherId) {
          const matchedTeacher = state.teachers.find((t) => t.id === saved.activeTeacherId);
          if (!matchedTeacher) {
            clearPersistedActiveViewSession();
            return false;
          }

          state.activeTeacherId = matchedTeacher.id;
          if (matchedTeacher.role === 'guru') {
            state.selectedWorkspaceTeacherId = matchedTeacher.id;
          } else if (
            saved.selectedWorkspaceTeacherId &&
            state.teachers.some((t) => t.id === saved.selectedWorkspaceTeacherId)
          ) {
            state.selectedWorkspaceTeacherId = saved.selectedWorkspaceTeacherId;
          } else {
            const firstGuru = state.teachers.find((t) => t.role === 'guru');
            state.selectedWorkspaceTeacherId = firstGuru ? firstGuru.id : matchedTeacher.id;
          }

          const savedTab = saved.proktorTab || 'beranda';
          state.proktorTab =
            matchedTeacher.role !== 'proktor' && (savedTab === 'guru' || savedTab === 'spreadsheet')
              ? 'beranda'
              : savedTab;
          state.tpSubTab = saved.tpSubTab || 'tp_generator';

          const ws = getWorkspaceTeacher() || matchedTeacher;
          state.examDurationInput = Number(ws.durationMinutes) || 60;
          const wsQCount = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
          state.examQuestionCountInput =
            wsQCount > 0
              ? Math.min(wsQCount, Number(ws.targetQuestionCount) || wsQCount)
              : Number(ws.targetQuestionCount) || 5;

          state.currentView = 'proktor';
          return true;
        }

        if (
          (saved.currentView === 'student_confirm' ||
            saved.currentView === 'student_exam' ||
            saved.currentView === 'student_result') &&
          saved.studentSession &&
          saved.studentSession.profile &&
          saved.studentSession.teacher
        ) {
          const sData = saved.studentSession;
          const qs = Array.isArray(sData.questions) ? sData.questions.map(normalizeQuestionRecord) : [];
          if (qs.length === 0) {
            clearPersistedActiveViewSession();
            return false;
          }

          if (saved.currentView === 'student_exam' && (Number(sData.remainingSeconds) || 0) <= 2) {
            clearPersistedActiveViewSession();
            return false;
          }

          state.studentSession = {
            profile: sData.profile,
            teacher: sData.teacher,
            integrityAgreed: Boolean(sData.integrityAgreed),
            activeSessionId: sData.activeSessionId || null,
            questions: qs,
            currentQIndex: Math.min(qs.length - 1, Math.max(0, Number(sData.currentQIndex) || 0)),
            answers: sData.answers && typeof sData.answers === 'object' ? { ...sData.answers } : {},
            doubtFlags: sData.doubtFlags && typeof sData.doubtFlags === 'object' ? { ...sData.doubtFlags } : {},
            fontScale: sData.fontScale || 'base',
            remainingSeconds: Math.max(15, Number(sData.remainingSeconds) || 600),
            resultSummary: sData.resultSummary || null,
            violationCount: Number(sData.violationCount) || 0,
            maxViolations: Number(sData.maxViolations) || 3,
            violationWarningModal: null,
            lastViolationTimestamp: 0,
            isEnteringFullscreen: false,
            hasEnteredFullscreen: false,
            isViolationAutoFinished: Boolean(sData.isViolationAutoFinished),
          };
          state.savedDraftPrompt = null;
          state.currentView = saved.currentView;
          return true;
        }
      } catch {}
      return false;
    }

          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),

    async function fetchFromSpreadsheet(overrideUrl = '', silent = true, forceFull = false) {
      const targetUrl = String(overrideUrl || state.spreadsheetApiUrl || '').trim();
      if (!targetUrl || !targetUrl.startsWith('http')) return false;

      if (!silent) setGlobalLoading(true);
      try {
        const sep = targetUrl.includes('?') ? '&' : '?';
const modeParam = (forceFull || (state.authUser && (state.authUser.role === 'guru' || state.authUser.role === 'proktor'))) ? '' : '&mode=student';
const res = await fetch(`${targetUrl}${sep}t=${Date.now()}${modeParam}`, { method: 'GET' });
        const text = await res.text();
        const parsed = JSON.parse(text);

        const data = parsed && parsed.data ? parsed.data : parsed;
        if (parsed && parsed.ok && data) {
          if (Array.isArray(data.teachers)) {
            const activeBeforeSync = state.activeTeacherId
              ? state.teachers.find((t) => t.id === state.activeTeacherId)
              : null;
            const merged = mergeTeachersWithSeeds(data.teachers);
            if (activeBeforeSync && !merged.some((t) => t.id === activeBeforeSync.id)) {
              merged.unshift(activeBeforeSync);
            }
            state.teachers = merged;

            const proktorWithKey = state.teachers.find((t) => extractGeminiKeyFromProktorCode(t.proktorCode));
            if (proktorWithKey) {
              const syncedKey = extractGeminiKeyFromProktorCode(proktorWithKey.proktorCode);
              if (syncedKey) {
                try {
                  localStorage.setItem(GEMINI_API_KEY_STORAGE_KEY, syncedKey);
                } catch {}
              }
            }
          }
          if (Array.isArray(data.tps)) {
            state.tps = data.tps;
          }
          if (Array.isArray(data.blueprints)) {
            state.blueprints = data.blueprints;
          }
          if (Array.isArray(data.questions)) {
            state.questions = data.questions.map(normalizeQuestionRecord);
          }
          if (Array.isArray(data.sessions)) {
            state.sessions = deduplicateSessionsList(data.sessions);
          }
          if (Array.isArray(data.registrations)) {
            state.teacherRegistrations = data.registrations;
          }

          const ws = getWorkspaceTeacher();
          if (ws) {
            state.examDurationInput = Number(ws.durationMinutes) || 60;
            const wsQCount = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
            state.examQuestionCountInput =
              wsQCount > 0
                ? Math.min(wsQCount, Number(ws.targetQuestionCount) || wsQCount)
                : Number(ws.targetQuestionCount) || 5;
          }

          state.spreadsheetStatus = {
            connected: true,
            lastSync: new Date().toISOString(),
            error: null,
          };
          saveLocalBackupDb();
          renderApp();
          if (!silent) showToast('Data berhasil disinkronkan dengan Google Spreadsheet!');
          return true;
        }
        return false;
      } catch (err) {
        state.spreadsheetStatus.error = String(err);
        if (!silent) showToast('Gagal menyinkronkan dengan Spreadsheet, menggunakan penyimpanan lokal.', 'warning');
        return false;
      } finally {
        if (!silent) setGlobalLoading(false);
      }
    }

    async function saveRecordUnified(table, id, data) {
      const recordId = id || `${table}_${Date.now()}_${Math.floor(Math.random() * 9000)}`;
      const record = { ...data, id: recordId };

      if (table === 'teachers') {
        const idx = state.teachers.findIndex((t) => t.id === recordId);
        if (idx >= 0) state.teachers[idx] = { ...state.teachers[idx], ...record };
        else state.teachers.push(record);
      } else if (table === 'tps') {
        const idx = state.tps.findIndex((t) => t.id === recordId);
        if (idx >= 0) state.tps[idx] = { ...state.tps[idx], ...record };
        else state.tps.push(record);
      } else if (table === 'blueprints') {
        const idx = state.blueprints.findIndex((b) => b.id === recordId);
        if (idx >= 0) state.blueprints[idx] = { ...state.blueprints[idx], ...record };
        else state.blueprints.push(record);
      } else if (table === 'questions') {
        const normQ = normalizeQuestionRecord(record);
        const idx = state.questions.findIndex((q) => q.id === recordId);
        if (idx >= 0) state.questions[idx] = normQ;
        else state.questions.push(normQ);
      } else if (table === 'sessions') {
        const idx = state.sessions.findIndex((s) => s.id === recordId);
        const rawList = [...state.sessions];
        if (idx >= 0) rawList[idx] = { ...rawList[idx], ...record };
        else rawList.push(record);
        state.sessions = deduplicateSessionsList(rawList);
      } else if (table === 'registrations') {
        const idx = state.teacherRegistrations.findIndex((r) => r.id === recordId);
        if (idx >= 0) state.teacherRegistrations[idx] = { ...state.teacherRegistrations[idx], ...record };
        else state.teacherRegistrations.push(record);
      }

      saveLocalBackupDb();
      await postToSpreadsheet({ action: 'upsert', table, data: record });
      return recordId;
    }

    async function deleteRecordUnified(table, id) {
      if (table === 'teachers') {
        state.teachers = state.teachers.filter((t) => t.id !== id);
      } else if (table === 'tps') {
        state.tps = state.tps.filter((t) => t.id !== id);
      } else if (table === 'blueprints') {
        state.blueprints = state.blueprints.filter((b) => b.id !== id);
      } else if (table === 'questions') {
        state.questions = state.questions.filter((q) => q.id !== id);
      } else if (table === 'sessions') {
        state.sessions = state.sessions.filter((s) => s.id !== id);
      } else if (table === 'registrations') {
        state.teacherRegistrations = state.teacherRegistrations.filter((r) => r.id !== id);
      }

      saveLocalBackupDb();
      await postToSpreadsheet({ action: 'delete', table, id });
      renderApp();
      showToast('Data berhasil dihapus.');
    }

    function openEmpiricalItemAnalysisModal() {
      const ws = getWorkspaceTeacher();
      if (!ws) return;

      const wsQuestions = state.questions
        .filter((q) => isOwnedByTeacher(q, ws))
        .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));

      const completedSessions = deduplicateSessionsList(state.sessions).filter(
        (s) =>
          s.status === 'selesai' &&
          (String(s.teacherId || '').trim() === String(ws.id || '').trim() ||
            String(s.tokenUsed || '').trim().toUpperCase() === String(ws.token || '').trim().toUpperCase())
      );

      const items = wsQuestions.map((q, idx) => {
        let totalAttempts = 0;
        let fullCorrectCount = 0;
        let earnedRatioSum = 0;

        completedSessions.forEach((sess) => {
          const ansMap = sess.answers && typeof sess.answers === 'object' ? sess.answers : {};
          if (!(q.id in ansMap)) return;
          totalAttempts += 1;
          const ans = ansMap[q.id];
          let ratio = 0;

          if (q.type === 'PG') {
            if (typeof ans === 'number' && ans === Number(q.correctAnswer)) ratio = 1;
          } else if (q.type === 'PG_KOMPLEKS') {
            const correctSet = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
            const userSet = Array.isArray(ans) ? ans : [];
            if (correctSet.length > 0 && userSet.length > 0) {
              let hits = 0;
              let wrongPicks = 0;
              userSet.forEach((pick) => {
                if (correctSet.includes(pick)) hits += 1;
                else wrongPicks += 1;
              });
              ratio = Math.max(0, (hits - wrongPicks * 0.5) / correctSet.length);
            }
          } else if (q.type === 'BENAR_SALAH') {
            const correctArr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
            const userObj = ans && typeof ans === 'object' ? ans : {};
            if (correctArr.length > 0) {
              let matches = 0;
              correctArr.forEach((expectedBool, sIdx) => {
                if (userObj[sIdx] === expectedBool) matches += 1;
              });
              ratio = matches / correctArr.length;
            }
          }

          if (ratio >= 0.999) fullCorrectCount += 1;
          earnedRatioSum += ratio;
        });

        const difficultyIndex =
          totalAttempts > 0 ? Math.round((earnedRatioSum / totalAttempts) * 100) : null;
        let category = 'Belum Ada Responden';
        let badgeClass = 'bg-slate-100 text-slate-600';
        if (difficultyIndex !== null) {
          if (difficultyIndex > 70) {
            category = 'Mudah (P > 0,70)';
            badgeClass = 'bg-emerald-100 text-emerald-800';
          } else if (difficultyIndex >= 30) {
            category = 'Sedang / Ideal (0,30–0,70)';
            badgeClass = 'bg-sky-100 text-[#002b7a]';
          } else {
            category = 'Sukar (P < 0,30)';
            badgeClass = 'bg-amber-100 text-amber-800';
          }
        }

        return {
          number: idx + 1,
          tpCode: q.tpCode || 'TP.1',
          type: q.type,
          questionText: q.questionText,
          totalAttempts,
          fullCorrectCount,
          difficultyIndex,
          category,
          badgeClass,
        };
      });

      state.empiricalAnalysisModal = {
        subject: ws.subject,
        teacherName: ws.name,
        totalRespondents: completedSessions.length,
        items,
      };
      renderModals();
    }

    function renderDonutChartSvg(title, centerText, segments) {
      const total = segments.reduce((acc, s) => acc + (Number(s.value) || 0), 0);
      const radius = 56;
      const circumference = 2 * Math.PI * radius;
      let offset = 0;

      const circlesHtml =
        total === 0
          ? `<circle cx="110" cy="95" r="${radius}" fill="none" stroke="#e2e8f0" stroke-width="18" />`
          : segments
              .map((seg) => {
                const val = Number(seg.value) || 0;
                const dash = (val / total) * circumference;
                const circle = `<circle cx="110" cy="95" r="${radius}" fill="none" stroke="${seg.color}" stroke-width="18" stroke-dasharray="${dash} ${circumference}" stroke-dashoffset="${-offset}" transform="rotate(-90 110 95)" />`;
                offset += dash;
                return circle;
              })
              .join('');

      const legendHtml = segments
        .map(
          (seg) => `

    async function sha256Hex(text) {
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(String(text || ''));
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer))
          .map((b) => b.toString(16).padStart(2, '0'))
          .join('');
      } catch {
        return '';
      }
    }

    function isTouchMobileOrTabletDevice() {

        const uaMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(

        return hasTouch && (uaMobile || window.innerWidth <= 1024);

    }

    async function requestExamFullscreen() {

        if (el && el.requestFullscreen && !document.fullscreenElement) {

          await el.requestFullscreen();
          ss.hasEnteredFullscreen = true;
        } else if (isTouchMobileOrTabletDevice()) {
          ss.hasEnteredFullscreen = false;
        }
      } catch {
        // Browser memblokir fullscreen otomatis

    function registerStudentViolation(reason) {
      const ss = state.studentSession;
      if (isPageUnloading || state.currentView !== 'student_exam' || state.isSubmittingExam || ss.isViolationAutoFinished) {
        return;
      }

      const now = Date.now();
      if (now - (ss.lastViolationTimestamp || 0) < 1500) return;
      ss.lastViolationTimestamp = now;

      const nextCount = (Number(ss.violationCount) || 0) + 1;
      const maxV = Number(ss.maxViolations) || 3;
      ss.violationCount = nextCount;
      saveStudentExamDraft();

      if (nextCount >= maxV) {
        handleFinishExam(false, true);
        return;
      }

      ss.violationWarningModal = {
        count: nextCount,
        max: maxV,
        reason: reason || 'Meninggalkan layar ujian',
      };
      renderApp();
    }

    function isQuestionAnswered(q) {
      if (!q) return false;
      const ans = state.studentSession.answers[q.id];
      if (q.type === 'PG') {
        return typeof ans === 'number' && ans >= 0;
      }
      if (q.type === 'PG_KOMPLEKS') {
        return Array.isArray(ans) && ans.length > 0;
      }
      if (q.type === 'BENAR_SALAH') {
        if (!ans || typeof ans !== 'object') return false;
        const totalStmts = Array.isArray(q.options) ? q.options.length : 0;
        if (totalStmts === 0) return false;
        for (let i = 0; i < totalStmts; i++) {
          if (typeof ans[i] !== 'boolean') return false;
        }
        return true;
      }
      return false;
    }

    function togglePgKompleksOption(qId, optIdx) {
      const prev = Array.isArray(state.studentSession.answers[qId])
        ? [...state.studentSession.answers[qId]]
        : [];
      const existsIdx = prev.indexOf(optIdx);
      if (existsIdx >= 0) prev.splice(existsIdx, 1);
      else prev.push(optIdx);
      state.studentSession.answers[qId] = prev.sort((a, b) => a - b);
      saveStudentExamDraft();
      renderApp();
    }

    function openSubmitExamConfirm() {
      const ss = state.studentSession;
      const totalQ = ss.questions.length;
      const answeredCount = ss.questions.filter(isQuestionAnswered).length;
      const unansweredCount = totalQ - answeredCount;
      const doubtCount = ss.questions.filter((q) => ss.doubtFlags[q.id]).length;

      const warningParts = [];
      if (unansweredCount > 0) warningParts.push(`${unansweredCount} soal belum dijawab`);
      if (doubtCount > 0) warningParts.push(`${doubtCount} soal masih ditandai ragu-ragu`);

      const extraNote =
        warningParts.length > 0
          ? ` Perhatian: Masih terdapat ${warningParts.join(' dan ')}.`
          : ' Seluruh soal telah terjawab dengan lengkap.';

      openConfirmModal({
        title: 'Kumpulkan & Akhiri Tes TKA?',
        message: `Anda telah menjawab ${answeredCount} dari ${totalQ} butir soal.${extraNote} Setelah dikumpulkan, jawaban tidak dapat diubah kembali.`,
        confirmText: 'Ya, Kumpulkan Jawaban',
        confirmColor: 'bg-emerald-600 hover:bg-emerald-700',
        onConfirm: async () => {
          await handleFinishExam(false, false);
        },
      });
    }

    async function handleFinishExam(isAutoTimeout = false, isViolationAutoFinish = false) {
      const ss = state.studentSession;
      if (!ss.profile || !ss.teacher || ss.questions.length === 0 || state.isSubmittingExam) return;

      state.isSubmittingExam = true;
      ss.violationWarningModal = null;
      exitExamFullscreen();
      renderApp();

      try {
        let totalWeight = 0;
        let earnedWeight = 0;
        const tpAccumulator = {};

        ss.questions.forEach((q) => {
          const w = Number(q.weight) || 20;
          totalWeight += w;
          const ans = ss.answers[q.id];
          let ratio = 0;

          if (q.type === 'PG') {
            if (typeof ans === 'number' && ans === Number(q.correctAnswer)) {
              ratio = 1;
            }
          } else if (q.type === 'PG_KOMPLEKS') {
            const correctSet = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
            const userSet = Array.isArray(ans) ? ans : [];
            if (correctSet.length > 0 && userSet.length > 0) {
              let hits = 0;
              let wrongPicks = 0;
              userSet.forEach((pick) => {
                if (correctSet.includes(pick)) hits += 1;
                else wrongPicks += 1;
              });
              ratio = Math.max(0, (hits - wrongPicks * 0.5) / correctSet.length);
            }
          } else if (q.type === 'BENAR_SALAH') {
            const correctArr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
            const userObj = ans && typeof ans === 'object' ? ans : {};
            if (correctArr.length > 0) {
              let matches = 0;
              correctArr.forEach((expectedBool, idx) => {
                if (userObj[idx] === expectedBool) matches += 1;
              });
              ratio = matches / correctArr.length;
            }
          }

          const earned = w * ratio;
          earnedWeight += earned;

          const tpKey = q.tpCode || 'TP.1';
          if (!tpAccumulator[tpKey]) {
            const tpMeta = state.tps.find(
              (t) => isOwnedByTeacher(t, ss.teacher) && (t.id === q.tpId || t.code === tpKey)
            );
            tpAccumulator[tpKey] = {
              tpCode: tpKey,
              description: tpMeta?.description || `Capaian Pembelajaran ${tpKey}`,
              kktp: Number(tpMeta?.kktp) || 75,
              totalW: 0,
              earnedW: 0,
            };
          }
          tpAccumulator[tpKey].totalW += w;
          tpAccumulator[tpKey].earnedW += earned;
        });

        let finalScore = totalWeight > 0 ? Math.round((earnedWeight / totalWeight) * 100) : 0;
        let tpBreakdown = Object.values(tpAccumulator).map((item) => {
          const tpScore = item.totalW > 0 ? Math.round((item.earnedW / item.totalW) * 100) : 0;
          return {
            tpCode: item.tpCode,
            description: item.description,
            kktp: item.kktp,
            score: tpScore,
            passed: tpScore >= item.kktp,
          };
        });

        const avgKktp =
          tpBreakdown.length > 0
            ? Math.round(tpBreakdown.reduce((a, b) => a + b.kktp, 0) / tpBreakdown.length)
            : 75;
        let overallPassed = finalScore >= avgKktp;

        const existingSession = state.sessions.find(
          (s) =>
            (ss.activeSessionId && s.id === ss.activeSessionId) ||
            (String(s.nisn || '').trim().toLowerCase() === String(ss.profile.nisn).trim().toLowerCase() &&
              String(s.teacherId || '').trim().toLowerCase() === String(ss.teacher.id).trim().toLowerCase())
        );

        const targetSessionId = existingSession ? existingSession.id : ss.activeSessionId;
        const startedAtIso = existingSession?.startedAt || new Date().toISOString();
        const finishedAtIso = new Date().toISOString();

        // 1. Simpan cadangan lokal terlebih dahulu sebelum kirim ke server (Anti-Hilang Data)
        const pendingSubmission = {
          sessionId: targetSessionId,
          studentName: ss.profile.name,
          nisn: ss.profile.nisn,
          studentClass: ss.profile.studentClass,
          teacherId: ss.teacher.id,
          teacherName: ss.teacher.name,
          subject: ss.teacher.subject,
          tokenUsed: ss.profile.token,
          startedAt: startedAtIso,
          finishedAt: finishedAtIso,
          answers: ss.answers || {},
        };
        try {
          localStorage.setItem('tka_pending_submit_' + ss.profile.nisn, JSON.stringify(pendingSubmission));
        } catch (e) {}

        // 2. Kirim ke server GAS (submitExam) dengan Auto-Retry 3x untuk menghadapi jaringan padat
        let serverResult = null;
        if (isSpreadsheetMode()) {
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              const res = await fetch(state.spreadsheetApiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                  action: 'submitExam',
                  ...pendingSubmission,
                }),
              });
              const parsed = await res.json();
              if (parsed && parsed.ok) {
                serverResult = parsed;
                try {
                  localStorage.removeItem('tka_pending_submit_' + ss.profile.nisn);
                } catch (e) {}
                break;
              } else if (parsed && parsed.error) {
                throw new Error(parsed.error);
              }
            } catch (err) {
              if (attempt < 3) {
                await new Promise((r) => setTimeout(r, attempt * 1500));
              } else {
                showToast('Jaringan padat/terputus. Jawaban tersimpan aman di perangkat, silakan lapor Proktor jika belum masuk rekap.', 'warning');
              }
            }
          }
        }

        if (serverResult) {
          finalScore = Number(serverResult.score) || 0;
          overallPassed = Boolean(serverResult.passed);
          if (Array.isArray(serverResult.tpBreakdown)) {
            tpBreakdown = serverResult.tpBreakdown;
          }
        }

        // 3. Sinkronkan state lokal agar hasil ujian langsung muncul di layar siswa
        const finalRecord = {
          id: targetSessionId,
          studentName: ss.profile.name,
          nisn: ss.profile.nisn,
          studentClass: ss.profile.studentClass,
          teacherId: ss.teacher.id,
          teacherName: ss.teacher.name,
          subject: ss.teacher.subject,
          tokenUsed: ss.profile.token,
          status: 'selesai',
          startedAt: startedAtIso,
          finishedAt: finishedAtIso,
          score: finalScore,
          passed: overallPassed,
          tpBreakdownJson: JSON.stringify(tpBreakdown),
          answersJson: JSON.stringify(ss.answers),
        };
        const idxSession = state.sessions.findIndex((s) => s.id === targetSessionId);
        if (idxSession >= 0) state.sessions[idxSession] = finalRecord;
        else state.sessions.push(finalRecord);
        saveLocalBackupDb();

        clearStudentExamDraft();

        ss.isViolationAutoFinished = Boolean(isViolationAutoFinish);
        ss.resultSummary = {
          score: finalScore,
          passed: overallPassed,
          tpBreakdown,
        };
        state.currentView = 'student_result';
        if (isViolationAutoFinish) {
          showToast(
            'Batas pelanggaran keamanan tercapai (3/3). Sistem otomatis mengakhiri tes dan mengirimkan jawaban Anda.',
            'error',
            'Tes Diakhiri Otomatis'
          );
        } else if (isAutoTimeout) {
          showToast('Waktu pengerjaan telah habis. Jawaban Anda otomatis dikumpulkan.', 'warning', 'Waktu Habis');
        }
      } finally {
        state.isSubmittingExam = false;
        renderApp();
      }
    }

    async function handleRegenerateToken(teacherId) {
      const target = state.teachers.find((t) => t.id === teacherId);
      if (!target) return;
      const existingTokens = state.teachers.map((t) => t.token);
      const newToken = generateUniqueToken(existingTokens, target.subject);

      await runWithSavingAnimation(
        'Memperbarui token ujian baru...',
        async () => {
          await saveRecordUnified('teachers', target.id, { ...target, token: newToken });
        },
        `Token ujian baru untuk ${target.subject} adalah: ${newToken}`
      );
      renderApp();
    }

    async function handleUpdateExamSettings(toggleOpen = false) {
      const ws = getWorkspaceTeacher();
      if (!ws) return;

      const availableQuestions = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
      const durationMinutes = Math.max(5, Math.min(240, Number(state.examDurationInput) || 60));
      const rawTargetCount = Math.max(1, Math.min(100, Number(state.examQuestionCountInput) || 5));

      if (!toggleOpen && availableQuestions > 0 && rawTargetCount > availableQuestions) {
        showToast(
          `Jumlah butir soal ditampilkan (${rawTargetCount}) melebihi ketersediaan Bank Soal saat ini (${availableQuestions} butir). Masukkan maksimal ${availableQuestions} soal.`,
          'error',
          'Validasi Jumlah Soal'
        );
        return;
      }

      const targetQuestionCount =
        availableQuestions > 0 ? Math.min(rawTargetCount, availableQuestions) : rawTargetCount;
      state.examQuestionCountInput = targetQuestionCount;
      const nextExamOpen = toggleOpen ? !(ws.examOpen !== false) : ws.examOpen !== false;

      await runWithSavingAnimation(
        'Menyimpan pengaturan ujian...',
        async () => {
          await saveRecordUnified('teachers', ws.id, {
            ...ws,
            durationMinutes,
            targetQuestionCount,
            examOpen: nextExamOpen,
          });
        },
        toggleOpen
          ? `Status sesi ujian diubah menjadi ${nextExamOpen ? 'DIBUKA' : 'DITUTUP'}.`
          : `Pengaturan ujian (${durationMinutes} menit, ${targetQuestionCount} soal) disimpan!`
      );
      renderApp();
    }

    function isRecordLinkedToTp(record, tp) {
      if (!record || !tp) return false;
      const rTid = String(record.teacherId || '').trim();
      const tpTid = String(tp.teacherId || '').trim();
      const rTok = String(record.teacherToken || '').trim().toUpperCase();
      const tpTok = String(tp.teacherToken || '').trim().toUpperCase();

      const sameOwner =
        rTid && tpTid
          ? rTid === tpTid
          : rTok && tpTok
          ? rTok === tpTok
          : true;
      if (!sameOwner) return false;

      const recTpId = String(record.tpId || '').trim();
      const targetTpId = String(tp.id || '').trim();
      if (recTpId && targetTpId) {
        return recTpId === targetTpId;
      }

      const recTpCode = String(record.tpCode || '').trim().toUpperCase();
      const targetTpCode = String(tp.code || '').trim().toUpperCase();
      return Boolean(recTpCode && targetTpCode && recTpCode === targetTpCode);
    }

    function handleDeleteTp(tpId) {
      const tp = state.tps.find((t) => t.id === tpId);
      if (!tp) return;

      const relatedBlueprints = state.blueprints.filter((b) => isRecordLinkedToTp(b, tp));
      const relatedQuestions = state.questions.filter((q) => isRecordLinkedToTp(q, tp));

      openConfirmModal({
        title: `Hapus Tujuan Pembelajaran (${tp.code})?`,
        message: `Data capaian ${tp.code} beserta ${relatedBlueprints.length} Kisi-Kisi dan ${relatedQuestions.length} Butir Soal di Bank Soal yang terkait dengan ${tp.code} akan dihapus permanen.`,
        confirmText: 'Ya, Hapus TP & Soal Terkait',
        confirmColor: 'bg-red-600 hover:bg-red-700',
        onConfirm: async () => {
          await runWithSavingAnimation(
            `Menghapus ${tp.code}, kisi-kisi, dan bank soal terkait...`,
            async () => {
              const bpIds = new Set(relatedBlueprints.map((b) => b.id));
              const qIds = new Set(relatedQuestions.map((q) => q.id));

              state.tps = state.tps.filter((t) => t.id !== tp.id);
              state.blueprints = state.blueprints.filter((b) => !bpIds.has(b.id));
              state.questions = state.questions.filter((q) => !qIds.has(q.id));

              if (state.tpForm.editingId === tp.id) {
                resetTpForm();
              }
              if (state.bpForm.editingId && bpIds.has(state.bpForm.editingId)) {
                resetBlueprintForm();
              }
              if (state.qForm.editingId && qIds.has(state.qForm.editingId)) {
                resetQuestionForm();
              }

              saveLocalBackupDb();
              renderApp();

              await postToSpreadsheet({ action: 'delete', table: 'tps', id: tp.id });
              for (const bp of relatedBlueprints) {
                await postToSpreadsheet({ action: 'delete', table: 'blueprints', id: bp.id });
              }
              for (const q of relatedQuestions) {
                await postToSpreadsheet({ action: 'delete', table: 'questions', id: q.id });
              }

              const ws = getWorkspaceTeacher();
              if (ws) {
                const totalRemaining = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
                if (totalRemaining > 0 && Number(ws.targetQuestionCount) > totalRemaining) {
                  await saveRecordUnified('teachers', ws.id, {
                    ...ws,
                    targetQuestionCount: totalRemaining,
                  });
                  state.examQuestionCountInput = totalRemaining;
                }
              }
            },
            `${tp.code} beserta ${relatedBlueprints.length} kisi-kisi dan ${relatedQuestions.length} soal terkait berhasil dihapus.`
          );
          renderApp();
        },
      });
    }

      const bank = isMath
        ? mathScenarios
        : isIndo
        ? indoScenarios
        : isKik
        ? kikScenarios
        : generalScenarios;

      for (let i = 0; i < total; i++) {
        const template = bank[(i + rotationOffset) % bank.length];
        const harmonized = harmonizeGeneratedOptions(template.options);
        items.push({
          ...template,
          options: harmonized,
          weight: Math.round(100 / total),
        });
      }
      return distributeGeneratedOptionKeys(items);
    }

    async function generateAndSaveTkaBundleForTp(teacher, tpRecord, count = 5) {
      const quotaInfo = getTeacherDailyQuotaInfo(teacher);
      const requestedCount = Math.max(1, Math.min(30, Number(count) || 5));
      const useBackupGenerator =
        !quotaInfo.isUnlimited &&
        (quotaInfo.remaining <= 0 || requestedCount > quotaInfo.remaining);

      if (useBackupGenerator) {
        showToast(
          `Permintaan ${requestedCount} soal melebihi sisa kuota API harian Anda (${quotaInfo.remaining}/${quotaInfo.limit} soal). Sistem otomatis beralih ke generator cadangan lokal tanpa menggunakan kuota API Key.`,
          'info',
          'Mode Generator Cadangan Aktif'
        );
      }
      const targetCount = Math.max(1, Math.min(30, Number(count) || 5));
      const selectedDeepPhase = tpRecord.deepLearningPhase || DEEP_LEARNING_EXPERIENCES[1];
      const selectedGradDim = tpRecord.graduateDimension || GRADUATE_PROFILE_DIMENSIONS[0];

      const systemPrompt = `Anda adalah pakar pengembang soal Tes Kemampuan Akademik (TKA) Pusmendik Kemendikdasmen RI yang mengacu ketat pada:
- UU No. 20 Tahun 2003 Pasal 57-59 & PP No. 57/2021 jo. PP No. 4/2022 (validitas isi evaluasi hasil belajar);
- Permendikdasmen No. 9 Tahun 2025 & Permendikdasmen No. 11 Tahun 2025 tentang Penyelenggaraan TKA;
- Perka BSKAP No. 45 & 47 Tahun 2025 tentang Kerangka Asesmen TKA;
- Panduan Pembelajaran Mendalam (Deep Learning) Kemendikdasmen 2025/2026.

ATURAN WAJIB PENYUSUNAN SOAL TKA BERBASIS NASKAH STIMULUS TERPADU (TESTLET):
1. VALIDITAS ISI SESUAI TP (UU SISDIKNAS): Seluruh butir soal WAJIB mengukur kompetensi spesifik yang tertuang dalam Deskripsi Capaian Tujuan Pembelajaran (TP) pada mata pelajaran "${teacher.subject}". DILARANG membuat soal di luar lingkup TP.
2. PENDEKATAN PEMBELAJARAN MENDALAM (DEEP LEARNING):
   - Terapkan 3 Prinsip Pembelajaran Mendalam: Berkesadaran (Mindful), Bermakna (Meaningful), dan Menggembirakan (Joyful).
   - Arahkan pada pengalaman belajar "${selectedDeepPhase}" dan penguatan dimensi profil lulusan "${selectedGradDim}".
3. FORMAT RESMI TKA (1 NASKAH STIMULUS UNTUK 2–3 SOAL BERURUTAN):
   - Susun soal dalam bentuk KELOMPOK STIMULUS (Testlet): setiap 1 naskah stimulus ("stimulusTitle" + "stimulusText" yang kaya konteks nyata, data kuantitatif/angka, studi kasus, kondisi sistem, atau kutipan naskah 2–3 paragraf) digunakan bersama untuk 2 hingga 3 butir soal berurutan dengan kode "stimulusGroup" yang SAMA (misal: "G1", "G1", "G1" lalu "G2", "G2").
   - Teks naskah utama diletakkan utuh di "stimulusText" (identik untuk semua butir dalam satu "stimulusGroup"), sedangkan "questionText" hanya berisi pokok pertanyaan spesifik untuk nomor butir tersebut tanpa mengulang-ulang naskah stimulus.
   - Antarkelompok ("G1" vs "G2") wajib memiliki tema kasus, data, dan sudut pandang masalah yang 100% berbeda.
4. LEVEL KOGNITIF HOTS (L2 & L3) & VARIASI BENTUK SOAL DALAM 1 NASKAH:
   - Dalam satu kelompok stimulus yang sama, variasikan bentuk soal secara berjenjang: Butir 1 ("PG" - L2/L3 analisis kasus), Butir 2 ("PG_KOMPLEKS" - L3 evaluasi multi-faktor), dan Butir 3 ("BENAR_SALAH" - L3 pengujian validitas pernyataan terhadap data naskah).
5. KESETARAAN STRUKTUR KALIMAT & PANJANG TEKS ALAMI (EYD EDISI V): Pengecoh homogen, rasional, struktur paralel, panjang opsi seimbang (selisih <= 12%).
6. SEBARAN KUNCI JAWABAN: Acak posisi kunci jawaban sehingga tersebar merata.`;

      const responseSchema = {
        type: 'OBJECT',
        properties: {
          items: {
            type: 'ARRAY',
            items: {
              type: 'OBJECT',
              properties: {
                stimulusGroup: { type: 'STRING' },
                stimulusTitle: { type: 'STRING' },
                stimulusText: { type: 'STRING' },
                deepLearningPhase: { type: 'STRING' },
                graduateDimension: { type: 'STRING' },
                material: { type: 'STRING' },
                stimulusType: { type: 'STRING' },
                indicator: { type: 'STRING' },
                cognitiveLevel: { type: 'STRING' },
                questionType: { type: 'STRING' },
                questionText: { type: 'STRING' },
                optionStructureSummary: { type: 'STRING' },
                options: {
                  type: 'ARRAY',
                  items: { type: 'STRING' },
                },
                correctPgIndex: { type: 'INTEGER' },
                correctMultiIndices: {
                  type: 'ARRAY',
                  items: { type: 'INTEGER' },
                },
                correctBsBooleans: {
                  type: 'ARRAY',
                  items: { type: 'BOOLEAN' },
                },
              },
              required: [
                'stimulusGroup',
                'stimulusTitle',
                'stimulusText',
                'deepLearningPhase',
                'graduateDimension',
                'material',
                'stimulusType',
                'indicator',
                'cognitiveLevel',
                'questionType',
                'questionText',
                'optionStructureSummary',
                'options',
              ],
            },
          },
        },
        required: ['items'],
      };

      const BATCH_SIZE = 6;
      let generatedItems = [];
      const usedTopicsSummary = [];
      let fallbackCountUsed = 0;
      let lastFallbackReason = '';

      while (generatedItems.length < targetCount) {
        const remaining = targetCount - generatedItems.length;
        const currentBatchSize = Math.min(BATCH_SIZE, remaining);
        const batchNumber = Math.floor(generatedItems.length / BATCH_SIZE) + 1;
        const batchSeed = `${Date.now()}-B${batchNumber}`;

        const antiRepeatInstruction =
          usedTopicsSummary.length > 0
            ? `\n\nPENTING - LARANGAN PENGULANGAN NASKAH (BATCH KE-${batchNumber}):\nNaskah stimulus berikut SUDAH DIBUAT sebelumnya. Buat naskah kasus dan topik yang 100% BARU:\n- ${usedTopicsSummary.join('\n- ')}`
            : '';

        const userPrompt = `Susun paket lengkap sebanyak ${currentBatchSize} butir Kisi-Kisi Pembelajaran Mendalam dan ${currentBatchSize} butir Soal TKA berbasis Naskah Stimulus Terpadu (setiap 1 naskah stimulus digunakan bersama untuk 2–3 butir soal berurutan dengan kode stimulusGroup yang sama, misalnya G1 untuk 3 soal pertama lalu G2 untuk soal berikutnya) untuk:
- Mata Pelajaran: ${teacher.subject}
- Kode TP: ${tpRecord.code}
- Fase / Kelas: ${tpRecord.phase}
- Pengalaman Belajar Mendalam Utama: ${selectedDeepPhase}
- Dimensi Profil Lulusan: ${selectedGradDim}
- Deskripsi Capaian TP: ${tpRecord.description}
- KKTP Minimal: ${tpRecord.kktp}${antiRepeatInstruction}`;

        try {
          if (useBackupGenerator) throw new Error('DAILY_QUOTA_BACKUP_MODE');
          const aiResult = await callGeminiTkaJson(systemPrompt, userPrompt, responseSchema);
          if (aiResult && Array.isArray(aiResult.items) && aiResult.items.length > 0) {
            const batchNormalized = aiResult.items.slice(0, currentBatchSize).map((raw, rIdx) => {
              const qType =
                raw.questionType === 'PG_KOMPLEKS' || raw.questionType === 'BENAR_SALAH'
                  ? raw.questionType
                  : 'PG';
              const harmonizedOpts = harmonizeGeneratedOptions(raw.options || []);
              const rawGroupKey = String(raw.stimulusGroup || `G${Math.floor(rIdx / 3) + 1}`).trim();
              const cleanStimulusText = String(raw.stimulusText || '').trim();
              const cleanStimulusTitle = String(raw.stimulusTitle || raw.material || 'Naskah Stimulus TKA').trim();
              const stimulusGroupId = cleanStimulusText ? `STIM-${batchSeed}-${rawGroupKey}` : '';

              usedTopicsSummary.push(
                `${cleanStimulusTitle}: ${String(cleanStimulusText || raw.questionText || '').replace(/\s+/g, ' ').slice(0, 95)}...`
              );
              return {
                ...raw,
                stimulusGroupId,
                stimulusTitle: cleanStimulusTitle,
                stimulusText: cleanStimulusText,
                deepLearningPhase: raw.deepLearningPhase || selectedDeepPhase,
                graduateDimension: raw.graduateDimension || selectedGradDim,
                questionType: qType,
                options: harmonizedOpts,
                generationSource: 'GEMINI',
              };
            });
            generatedItems.push(...batchNormalized);
          } else {
            throw new Error('Format output AI tidak memuat daftar butir soal.');
          }
        } catch (err) {
          lastFallbackReason = err?.message || '';
          fallbackCountUsed += currentBatchSize;
          const fallbackSlice = buildFallbackTkaBundle(
            teacher,
            tpRecord,
            currentBatchSize,
            generatedItems.length
          );
          fallbackSlice.forEach((fb) => {
            usedTopicsSummary.push(`${fb.material}: ${String(fb.questionText || '').slice(0, 80)}...`);
          });
          generatedItems.push(
          ...fallbackSlice.map((fb) => ({ ...fb, generationSource: 'FALLBACK' }))
        );
        }
      }

      if (fallbackCountUsed > 0) {
        const reasonMessage =
         lastFallbackReason === 'DAILY_QUOTA_BACKUP_MODE'
            ? `Batas kuota API harian dari Proktor Utama telah tercapai. ${fallbackCountUsed} butir soal disusun otomatis menggunakan sistem cadangan (bank templat standar BSKAP sesuai TP) tanpa menggunakan kuota API Key.`
            :
          lastFallbackReason === 'MISSING_API_KEY'
            ? `API Key Gemini AI belum dipasang oleh Proktor Utama. ${fallbackCountUsed} butir soal disusun menggunakan bank templat standar BSKAP sesuai TP.`
            : lastFallbackReason === 'INVALID_API_KEY'
            ? `API Key Gemini AI tidak valid atau kedaluwarsa. Periksa kembali API Key di menu Proktor Utama. ${fallbackCountUsed} butir soal disusun menggunakan templat standar.`
            : `Sebagian soal (${fallbackCountUsed} butir) disusun menggunakan bank templat terstandar sesuai TP karena kuota harian API gratis sudah mencapai batas.`;
        showToast(reasonMessage, 'warning', 'Info Generator');
      }

      generatedItems = distributeGeneratedOptionKeys(generatedItems.slice(0, targetCount));

      const existingBps = state.blueprints.filter((b) => isOwnedByTeacher(b, teacher));
      let nextBpNumber = existingBps.reduce((acc, b) => acc + Math.max(1, Number(b.questionCount) || 1), 0) + 1;
      let nextQOrder = getNextQuestionOrder(teacher);
      const weightPerItem = Math.max(1, Math.round(100 / generatedItems.length));

      const batchPayloadItems = [];

      for (let i = 0; i < generatedItems.length; i++) {
        const item = generatedItems[i];
        const bpId = `blueprints_${Date.now()}_${i}_${Math.floor(Math.random() * 9000)}`;
        const bpRecord = {
          id: bpId,
          teacherId: teacher.id,
          teacherToken: teacher.token,
          tpId: tpRecord.id,
          tpCode: tpRecord.code,
          questionNumber: nextBpNumber++,
          questionCount: 1,
          deepLearningPhase: item.deepLearningPhase || selectedDeepPhase,
          graduateDimension: item.graduateDimension || selectedGradDim,
          material: item.material || `Materi Esensial ${tpRecord.code}`,
          indicator: item.indicator || `Disajikan stimulus kontekstual, peserta didik dapat memecahkan masalah terkait ${tpRecord.code}.`,
          cognitiveLevel: item.cognitiveLevel || 'L2 - Aplikasi (C3)',
          questionType: item.questionType,
          stimulusType: item.stimulusType || 'Studi Kasus Kontekstual',
          createdAt: new Date().toISOString(),
        };
        state.blueprints.push(bpRecord);
        batchPayloadItems.push({ table: 'blueprints', data: bpRecord });

        let correctAnswer = 0;
        if (item.questionType === 'PG') {
          correctAnswer =
            typeof item.correctPgIndex === 'number' &&
            item.correctPgIndex >= 0 &&
            item.correctPgIndex < item.options.length
              ? item.correctPgIndex
              : 0;
        } else if (item.questionType === 'PG_KOMPLEKS') {
          const validMulti = Array.isArray(item.correctMultiIndices)
            ? item.correctMultiIndices.filter((idx) => idx >= 0 && idx < item.options.length)
            : [];
          correctAnswer = validMulti.length > 0 ? validMulti : [0, 1];
        } else {
          const validBs = Array.isArray(item.correctBsBooleans)
            ? item.correctBsBooleans.slice(0, item.options.length).map(Boolean)
            : [];
          while (validBs.length < item.options.length) {
            validBs.push(validBs.length % 2 === 0);
          }
          correctAnswer = validBs;
        }

        const localAudit = runLocalTkaAuditHeuristic({
          subject: teacher.subject,
          tpCode: tpRecord.code,
          tpDesc: tpRecord.description,
          type: item.questionType,
          questionText: item.questionText,
          options: item.options,
        });

        const qId = `questions_${Date.now()}_${i}_${Math.floor(Math.random() * 9000)}`;
          localAudit.generationSource = item.generationSource || 'GEMINI';
          if (item.stimulusGroupId) localAudit.stimulusGroupId = item.stimulusGroupId;
          if (item.stimulusTitle) localAudit.stimulusTitle = item.stimulusTitle;
          if (item.stimulusText) localAudit.stimulusText = item.stimulusText;
          const rawQuestionRecord = {
          id: qId,
          teacherId: teacher.id,
          teacherToken: teacher.token,
          tpId: tpRecord.id,
          tpCode: tpRecord.code,
          type: item.questionType,
          questionText: item.questionText,
          optionsJson: JSON.stringify(item.options),
          correctAnswerJson: JSON.stringify(correctAnswer),
          weight: weightPerItem,
          order: nextQOrder++,
          analysisJson: JSON.stringify(localAudit),
          createdAt: new Date().toISOString(),
        };

        state.questions.push(normalizeQuestionRecord(rawQuestionRecord));
        batchPayloadItems.push({ table: 'questions', data: rawQuestionRecord });
      }

      const updatedTotalQuestions = state.questions.filter((q) => isOwnedByTeacher(q, teacher)).length;
      const teacherIdx = state.teachers.findIndex((t) => t.id === teacher.id);
      if (teacherIdx >= 0) {
        const updatedTeacherRecord = {
          ...state.teachers[teacherIdx],
          targetQuestionCount: updatedTotalQuestions,
        };
        state.teachers[teacherIdx] = updatedTeacherRecord;
        batchPayloadItems.push({ table: 'teachers', data: updatedTeacherRecord });
      }
      if (getWorkspaceTeacher()?.id === teacher.id) {
        state.examQuestionCountInput = updatedTotalQuestions;
      }

      saveLocalBackupDb();
      await postToSpreadsheet({ action: 'batchUpsert', items: batchPayloadItems });
      return generatedItems.length;
    }

    async function handleSaveTp(e, autoGenerate = true) {
      if (e) e.preventDefault();
      const ws = getWorkspaceTeacher();
      if (!ws) return;

      const description = state.tpForm.description.trim();
      if (!description) {
        showToast('Deskripsi Capaian Tujuan Pembelajaran (TP) wajib diisi.', 'error', 'Data Belum Lengkap');
        return;
      }

      const wsTps = state.tps.filter((t) => isOwnedByTeacher(t, ws));
      const code = state.tpForm.code.trim() || `TP.${wsTps.length + 1}`;
      const phase = state.tpForm.phase.trim() || 'Fase F / Kelas XII';
      const deepLearningPhase = state.tpForm.deepLearningPhase || DEEP_LEARNING_EXPERIENCES[1];
      const graduateDimension = state.tpForm.graduateDimension || GRADUATE_PROFILE_DIMENSIONS[0];
      const kktp = Math.max(0, Math.min(100, Number(state.tpForm.kktp) || 75));
      const autoCount = Math.max(1, Math.min(30, Number(state.tpForm.autoCount) || 5));
      const durationMinutes = Math.max(
        5,
        Math.min(240, Number(state.examDurationInput) || Number(ws.durationMinutes) || 60)
      );
      state.examDurationInput = durationMinutes;
      const wasEditing = Boolean(state.tpForm.editingId);

      await runWithSavingAnimation(
        autoGenerate
          ? `Menyimpan ${code} & menyusun ${autoCount} Kisi-Kisi Pembelajaran Mendalam serta Soal TKA...`
          : `Menyimpan Tujuan Pembelajaran ${code}...`,
        async () => {
          if (durationMinutes !== (Number(ws.durationMinutes) || 60)) {
            await saveRecordUnified('teachers', ws.id, {
              ...ws,
              durationMinutes,
            });
          }

          const savedTpId = await saveRecordUnified('tps', state.tpForm.editingId, {
            teacherId: ws.id,
            teacherToken: ws.token,
            code,
            phase,
            deepLearningPhase,
            graduateDimension,
            description,
            kktp,
            createdAt: new Date().toISOString(),
          });

          const tpRecord = state.tps.find((t) => t.id === savedTpId) || {
            id: savedTpId,
            teacherId: ws.id,
            teacherToken: ws.token,
            code,
            phase,
            deepLearningPhase,
            graduateDimension,
            description,
            kktp,
          };

          if (autoGenerate) {
            await generateAndSaveTkaBundleForTp(ws, tpRecord, autoCount);
          }
          resetTpForm();
        },

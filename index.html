      URL.revokeObjectURL(url);
      renderApp();
      showToast(`File cadangan JSON Bank Soal (${wsQs.length} soal) berhasil diunduh!`);
    }

    function handleImportQuestionsJson(inputEl) {
      state.questionDownloadMenuOpen = false;
      const file = inputEl?.files?.[0];
      if (!file) return;

      const ws = getWorkspaceTeacher();
      if (!ws) return;

      const reader = new FileReader();
      reader.onload = async function (evt) {
        try {
          const parsed = JSON.parse(String(evt.target?.result || '{}'));
          const rawList = Array.isArray(parsed)
            ? parsed
            : Array.isArray(parsed.questions)
            ? parsed.questions
            : null;

          if (!rawList || rawList.length === 0) {
            throw new Error('Struktur JSON tidak memuat daftar butir soal (questions).');
          }

          const wsTps = state.tps.filter((t) => isOwnedByTeacher(t, ws));
          let nextOrder = getNextQuestionOrder(ws);
          const batchItems = [];
          let importedCount = 0;

          rawList.forEach((rawItem, idx) => {
            const qText = String(rawItem.questionText || rawItem.text || '').trim();
            const qType =
              rawItem.type === 'PG_KOMPLEKS' || rawItem.type === 'BENAR_SALAH'
                ? rawItem.type
                : 'PG';
            const opts = Array.isArray(rawItem.options)
              ? rawItem.options.map((o) => String(o || '').trim()).filter((o) => o !== '')
              : [];

            if (!qText || opts.length < 2) return;

            const matchedTp = wsTps.find(
              (t) => String(t.code || '').trim().toUpperCase() === String(rawItem.tpCode || '').trim().toUpperCase()
            ) || wsTps[0];

            let correctAns = rawItem.correctAnswer;
            if (qType === 'PG') {
              const num = Number(correctAns);
              correctAns = Number.isInteger(num) && num >= 0 && num < opts.length ? num : 0;
            } else if (qType === 'PG_KOMPLEKS') {
              const arr = Array.isArray(correctAns)
                ? correctAns.map(Number).filter((n) => Number.isInteger(n) && n >= 0 && n < opts.length)
                : [];
              correctAns = arr.length > 0 ? arr : [0];
            } else {
              const arr = Array.isArray(correctAns)
                ? correctAns.slice(0, opts.length).map(Boolean)
                : [];
              while (arr.length < opts.length) arr.push(arr.length % 2 === 0);
              correctAns = arr;
            }

            const qId = `questions_${Date.now()}_imp_${idx}_${Math.floor(Math.random() * 9000)}`;
            const record = {
              id: qId,
              teacherId: ws.id,
              teacherToken: ws.token,
              tpId: matchedTp ? matchedTp.id : '',
              tpCode: matchedTp ? matchedTp.code : String(rawItem.tpCode || 'TP.1'),
              type: qType,
              questionText: qText,
              stimulusImage: String(rawItem.stimulusImage || '').trim(),
              stimulusCaption: String(rawItem.stimulusCaption || '').trim(),
              optionsJson: JSON.stringify(opts),
              correctAnswerJson: JSON.stringify(correctAns),
              weight: Math.max(1, Math.min(100, Number(rawItem.weight) || 20)),
              order: nextOrder++,
              analysisJson: JSON.stringify(
                rawItem.analysis && typeof rawItem.analysis === 'object'
                  ? rawItem.analysis
                  : runLocalTkaAuditHeuristic({
                      subject: ws.subject,
                      tpCode: matchedTp?.code || 'TP.1',
                      tpDesc: matchedTp?.description || '',
                      type: qType,
                      questionText: qText,
                      options: opts,
                    })
              ),
              createdAt: new Date().toISOString(),
            };

            state.questions.push(normalizeQuestionRecord(record));
            batchItems.push({ table: 'questions', data: record });
            importedCount += 1;
          });

          if (importedCount === 0) {
            throw new Error('Tidak ada butir soal valid yang dapat diimpor dari berkas JSON tersebut.');
          }

          await runWithSavingAnimation(
            `Mengimpor ${importedCount} butir soal TKA...`,
            async () => {
              const totalWsQs = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
              const latestWs = state.teachers.find((t) => t.id === ws.id) || ws;
              const updatedTeacher = { ...latestWs, targetQuestionCount: totalWsQs };
              const tIdx = state.teachers.findIndex((t) => t.id === ws.id);
              if (tIdx >= 0) state.teachers[tIdx] = updatedTeacher;
              batchItems.push({ table: 'teachers', data: updatedTeacher });
              state.examQuestionCountInput = totalWsQs;

              saveLocalBackupDb();
              await postToSpreadsheet({ action: 'batchUpsert', items: batchItems });
            },
            `Berhasil mengimpor ${importedCount} butir soal TKA ke Bank Soal!`
          );
          renderApp();
        } catch (err) {
          showToast(err?.message || 'Berkas JSON tidak valid.', 'error', 'Gagal Impor JSON');
          renderApp();
        } finally {
          inputEl.value = '';
        }
      };
      reader.readAsText(file);
    }

    async function handleMoveQuestionOrder(qId, direction) {
      const ws = getWorkspaceTeacher();
      if (!ws) return;

      const wsQs = state.questions
        .filter((q) => isOwnedByTeacher(q, ws))
        .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));

      const idx = wsQs.findIndex((q) => q.id === qId);
      const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
      if (idx < 0 || targetIdx < 0 || targetIdx >= wsQs.length) return;

      const temp = wsQs[idx];
      wsQs[idx] = wsQs[targetIdx];
      wsQs[targetIdx] = temp;

      const batchItems = [];
      wsQs.forEach((qItem, newIndex) => {
        const updatedOrder = newIndex + 1;
        const globalIdx = state.questions.findIndex((item) => item.id === qItem.id);
        if (globalIdx >= 0) {
          state.questions[globalIdx].order = updatedOrder;
          batchItems.push({
            table: 'questions',
            data: {
              ...state.questions[globalIdx],
              optionsJson: JSON.stringify(state.questions[globalIdx].options || []),
              correctAnswerJson: JSON.stringify(state.questions[globalIdx].correctAnswer),
              analysisJson: JSON.stringify(state.questions[globalIdx].analysis || null),
            },
          });
        }
      });

      saveLocalBackupDb();
      renderApp();
      await postToSpreadsheet({ action: 'batchUpsert', items: batchItems });
    }

    async function handleNormalizeQuestionWeights() {
      const ws = getWorkspaceTeacher();
      if (!ws) return;

      const wsQs = state.questions
        .filter((q) => isOwnedByTeacher(q, ws))
        .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));

      if (wsQs.length === 0) return;

      const baseWeight = Math.floor(100 / wsQs.length);
      const remainder = 100 - baseWeight * wsQs.length;
      const batchItems = [];

      wsQs.forEach((qItem, idx) => {
        const balancedW = baseWeight + (idx < remainder ? 1 : 0);
        const globalIdx = state.questions.findIndex((item) => item.id === qItem.id);
        if (globalIdx >= 0) {
          state.questions[globalIdx].weight = balancedW;
          batchItems.push({
            table: 'questions',
            data: {
              ...state.questions[globalIdx],
              optionsJson: JSON.stringify(state.questions[globalIdx].options || []),
              correctAnswerJson: JSON.stringify(state.questions[globalIdx].correctAnswer),
              analysisJson: JSON.stringify(state.questions[globalIdx].analysis || null),
            },
          });
        }
      });

      await runWithSavingAnimation(
        'Menyeimbangkan bobot skor total 100...',
        async () => {
          saveLocalBackupDb();
          await postToSpreadsheet({ action: 'batchUpsert', items: batchItems });
        },
        `Bobot ${wsQs.length} soal berhasil diseimbangkan menjadi total tepat 100 poin!`
      );
      renderApp();
    }

    function resetQuestionForm() {
      state.qForm = {
        editingId: null,
        tpId: '',
        type: 'PG',
        text: '',
        stimulusImage: '',
        stimulusCaption: '',
        options: ['', '', '', '', ''],
        correctPg: 0,
        correctMulti: [0],
        statements: ['', '', ''],
        correctBs: [true, false, true],

        analysisPreview: null,
        isAnalyzing: false,
      };
      renderApp();
    }

    function runLocalTkaAuditHeuristic({ subject, tpCode, tpDesc, type, questionText, options }) {
      const qClean = String(questionText || '').trim();
      const qLower = qClean.toLowerCase();
      const cleanOpts = (options || []).map((o) => String(o || '').trim()).filter((o) => o !== '');
      const balanceInfo = evaluateOptionBalance(cleanOpts);

      let score = 100;
      const materiNotes = [];
      const konstruksiNotes = [];
      const bahasaNotes = [];
      const fixActions = [];

      const hasStimulus = qClean.length >= 110 && (qClean.includes('\n') || qClean.includes(':') || /\d/.test(qClean));
      const tpSnippet = String(tpDesc || '').trim().toLowerCase().slice(0, 38);
      const hasRawTpPaste = tpSnippet.length >= 20 && qLower.includes(tpSnippet);
      const isGenericBoilerplate =
        /dalam sebuah proyek evaluasi lapangan.*memenuhi standar capaian minimal/i.test(qClean) ||
        /dalam konteks pencapaian kompetensi.*pada mata pelajaran/i.test(qClean);

      if (hasRawTpPaste) {
        score -= 22;
        materiNotes.push('Terdeteksi salinan teks deskripsi TP mentah di dalam pokok soal; ganti dengan studi kasus nyata.');
        fixActions.push('Hapus kutipan deskripsi TP mentah dan ganti dengan stimulus studi kasus/data spesifik.');
      }
      if (isGenericBoilerplate) {
        score -= 25;
        materiNotes.push('Pokok soal terdeteksi menggunakan pola kalimat generik yang kurang spesifik pada konten materi.');
        fixActions.push('Rumuskan stimulus kasus spesifik mata pelajaran ' + subject + '.');
      }
      if (!hasStimulus) {
        score -= 18;
        materiNotes.push(`Stimulus kontekstual pada ${tpCode} masih terlalu singkat sehingga belum mendorong penalaran tingkat tinggi (L2/L3).`);
        fixActions.push('Tambahkan pengantar kasus, data numerik, atau kutipan teks yang fungsional.');
      } else if (!hasRawTpPaste && !isGenericBoilerplate) {
        materiNotes.push(`Selaras dengan ${tpCode} pada ${subject} serta memuat stimulus kontekstual yang fungsional.`);
      }

      const isRecallOnly =
        /^(apa pengertian|definisi dari|sebutkan pengertian|kepanjangan dari|siapa penemu)/i.test(qClean) &&
        !hasStimulus;
      let cognitiveLevel = hasStimulus ? 'L3 - Penalaran (C4)' : 'L2 - Aplikasi (C3)';
      if (isRecallOnly) {
        cognitiveLevel = 'L1 - Pemahaman/Hafalan (C1–C2)';
        score -= 16;
        materiNotes.push('Soal cenderung mengukur hafalan definisi (L1), belum memenuhi standar penalaran TKA.');
        fixActions.push('Ubah pertanyaan menjadi analisis kasus atau pemecahan masalah (L2/L3).');
      }

      const minRequiredOpts = type === 'BENAR_SALAH' ? 3 : type === 'PG_KOMPLEKS' ? 4 : 5;
      if (cleanOpts.length < minRequiredOpts) {
        score -= 12;
        konstruksiNotes.push(`Jumlah opsi/pernyataan (${cleanOpts.length}) kurang dari standar ideal (${minRequiredOpts} butir).`);
        fixActions.push(`Lengkapi menjadi ${minRequiredOpts} opsi/pernyataan yang homogen.`);
      }

      const weakDistractorPattern =
        /(mengabaikan data|menunda verifikasi|semua jawaban benar|semua jawaban salah|tidak ada jawaban yang benar)/i;
      const hasWeakDistractor = cleanOpts.some((opt) => weakDistractorPattern.test(opt));
      if (hasWeakDistractor) {
        score -= 15;
        konstruksiNotes.push('Terdapat pengecoh bernada negatif ekstrem atau klise ("semua benar/salah") yang mudah ditebak siswa.');
        fixActions.push('Ganti pengecoh ekstrem dengan pengecoh rasional berbasis miskonsepsi konsep.');
      }

      if (type !== 'BENAR_SALAH' && !balanceInfo.isBalanced) {
        score -= 14;
        konstruksiNotes.push(
          `Panjang teks antar opsi tidak seimbang (selisih ${balanceInfo.maxVariancePercent}%, melebihi batas maksimal 15%).`
        );
        fixActions.push('Setarakan panjang kalimat dan tingkat rincian antara kunci jawaban dan seluruh pengecoh (selisih <= 15%).');
      } else if (!hasWeakDistractor && cleanOpts.length >= minRequiredOpts) {
        konstruksiNotes.push(
          `Konstruksi soal valid, struktur kalimat paralel, dan panjang opsi seimbang (selisih ${balanceInfo.maxVariancePercent}% <= 15%).`
        );
      }

      const nonStandardWords = ['analisa', 'aktifitas', 'resiko', 'praktek', 'tehnik', 'sistim', 'mensosialisasikan', 'meminimalisir', 'mensukseskan'];
      const foundNonStandard = nonStandardWords.filter((w) => new RegExp(`\\b${w}\\b`, 'i').test(qClean + ' ' + cleanOpts.join(' ')));
      if (foundNonStandard.length > 0) {
        score -= 10;
        bahasaNotes.push(`Ditemukan kata tidak baku menurut EYD V (${foundNonStandard.join(', ')}).`);
        fixActions.push(`Perbaiki kata tidak baku (${foundNonStandard.join(', ')}) sesuai KBBI & EYD V.`);
      } else {
        bahasaNotes.push('Menggunakan bahasa Indonesia baku sesuai kaidah EYD Edisi V, lugas, dan bebas bias.');
      }

      const finalScore = Math.max(40, Math.min(98, score));
      const status =
        finalScore >= 85
          ? 'Layak Digunakan (Valid TKA)'
          : finalScore >= 70
          ? 'Layak dengan Catatan Revisi'
          : 'Perlu Revisi Substansial (Belum Memenuhi Syarat TKA)';

      return {
        cognitiveLevel,
        feasibilityScore: finalScore,
        status,
        materiCheck: materiNotes.join(' '),
        konstruksiCheck: konstruksiNotes.join(' '),
        bahasaCheck: bahasaNotes.join(' '),
        recommendation:
          fixActions.length === 0
            ? 'Butir soal memenuhi standar Perka BSKAP No. 45 & 47/2025 dan siap diujikan.'
            : 'Saran perbaikan: ' + fixActions.join(' '),
      };
    }

    async function runTkaQualityAnalysis({ subject, tpCode, tpDesc, type, questionText, options }) {
      const cleanOpts = (options || []).filter((o) => String(o).trim() !== '');
      const localAudit = runLocalTkaAuditHeuristic({
        subject,
        tpCode,
        tpDesc,
        type,
        questionText,
        options: cleanOpts,
      });

      const sysPrompt = `Anda adalah penelaah kritis butir soal Tes Kemampuan Akademik (TKA) Pusmendik Kemendikdasmen RI berdasarkan Permendikdasmen No. 9/2025 dan Perka BSKAP No. 45 & 47/2025.
Berikan penilaian OBJEKTIF dan KRITIS:
- Turunkan skor kelayakan secara tegas (di bawah 75%) jika soal bersifat generik, menyalin teks TP mentah, tidak memiliki stimulus fungsional, hanya mengukur hafalan (L1), memiliki pengecoh lemah/ekstrem, atau selisih panjang opsi > 15%.
- Berikan skor >= 85% HANYA jika stimulus autentik, level kognitif L2/L3, pengecoh homogen berbasis miskonsepsi, panjang opsi seragam (<= 15%), dan bahasa sesuai EYD V.`;

      const usrPrompt = `Telaah secara kritis butir soal TKA berikut:
- Mata Pelajaran: ${subject}
- Tujuan Pembelajaran (${tpCode}): ${tpDesc}
- Bentuk Soal: ${type}
- Pertanyaan / Stimulus: ${questionText}
- Pilihan / Pernyataan: ${cleanOpts.join(' | ')}`;

      const schema = {
        type: 'OBJECT',
        properties: {
          cognitiveLevel: { type: 'STRING' },
          feasibilityScore: { type: 'INTEGER' },
          status: { type: 'STRING' },
          materiCheck: { type: 'STRING' },
          konstruksiCheck: { type: 'STRING' },
          bahasaCheck: { type: 'STRING' },
          recommendation: { type: 'STRING' },
        },
        required: [
          'cognitiveLevel',
          'feasibilityScore',
          'status',
          'materiCheck',
          'konstruksiCheck',
          'bahasaCheck',
          'recommendation',
        ],
      };

      try {
        const aiAudit = await callGeminiTkaJson(sysPrompt, usrPrompt, schema);
        const boundedScore = Math.min(Number(aiAudit.feasibilityScore) || localAudit.feasibilityScore, localAudit.feasibilityScore);
        return {
          ...aiAudit,
          feasibilityScore: boundedScore,
          status:
            boundedScore >= 85
              ? 'Layak Digunakan (Valid TKA)'
              : boundedScore >= 70
              ? 'Layak dengan Catatan Revisi'
              : 'Perlu Revisi Substansial (Belum Memenuhi Syarat TKA)',
        };
      } catch {
        return localAudit;
      }
    }

    async function handleAnalyzeManualButton() {
      if (!state.qForm.text.trim()) {
        showToast('Tuliskan pertanyaan soal terlebih dahulu sebelum menganalisis.', 'error', 'Soal Kosong');
        return;
      }
      const ws = getWorkspaceTeacher();
      const wsTps = state.tps.filter((t) => isOwnedByTeacher(t, ws));

      const opts = state.qForm.type === 'BENAR_SALAH' ? state.qForm.statements : state.qForm.options;

      state.qForm.isAnalyzing = true;
      renderApp();

      try {
        const result = await runTkaQualityAnalysis({
          subject: ws?.subject || 'Umum',
          tpCode: selectedTp?.code || 'TP.1',
          tpDesc: selectedTp?.description || 'Tujuan Pembelajaran Terkait',
          type: state.qForm.type,
          questionText: state.qForm.text.trim(),
          options: opts,
        });
        state.qForm.analysisPreview = result;
      } finally {
        state.qForm.isAnalyzing = false;
        renderApp();
      }
    }

    function handleEditQuestion(qId) {
      const q = state.questions.find((item) => item.id === qId);
      if (!q) return;

      let options = ['', '', '', '', ''];
      let correctPg = 0;
      let correctMulti = [0];
      let statements = ['', '', ''];
      let correctBs = [true, false, true];

      if (q.type === 'BENAR_SALAH') {
        statements = Array.isArray(q.options) && q.options.length > 0 ? [...q.options] : ['', '', ''];
        correctBs =
          Array.isArray(q.correctAnswer) && q.correctAnswer.length === statements.length
            ? [...q.correctAnswer]
            : statements.map(() => true);
      } else {
        options = Array.isArray(q.options) ? [...q.options] : ['', '', '', '', ''];
        while (options.length < 5) options.push('');
        if (q.type === 'PG_KOMPLEKS') {
          correctMulti = Array.isArray(q.correctAnswer) ? [...q.correctAnswer] : [0];
        } else {
          correctPg = typeof q.correctAnswer === 'number' ? q.correctAnswer : 0;
        }
      }

      state.qForm = {
        editingId: q.id,
        tpId: q.tpId || '',
        type: q.type || 'PG',
        text: q.questionText || '',
        stimulusImage: q.stimulusImage || '',
        stimulusCaption: q.stimulusCaption || '',
        options,
        correctPg,
        correctMulti,
        statements,
        correctBs,
        weight: q.weight || 20,
        analysisPreview: q.analysis || null,
        isAnalyzing: false,
      };
      state.tpSubTab = 'bank_soal';
      renderApp();
    }

    async function handleSaveQuestion(e) {
      e.preventDefault();
      const ws = getWorkspaceTeacher();
      if (!ws) return;
      if (!state.qForm.text.trim()) {
        showToast('Teks pertanyaan soal wajib diisi.', 'error', 'Data Belum Lengkap');
        return;
      }

      const wsTps = state.tps.filter((t) => isOwnedByTeacher(t, ws));
      const selectedTp = wsTps.find((t) => t.id === state.qForm.tpId) || wsTps[0];
      const tpCode = selectedTp ? selectedTp.code : 'TP.1';

      let finalOptions = [];
      let finalCorrect = null;

      if (state.qForm.type === 'BENAR_SALAH') {
        const validPairs = state.qForm.statements
          .map((st, idx) => ({ st: st.trim(), ans: Boolean(state.qForm.correctBs[idx]) }))
          .filter((item) => item.st !== '');
        if (validPairs.length === 0) {
          showToast('Isi minimal 1 pernyataan untuk soal Benar/Salah.', 'error', 'Data Belum Lengkap');
          return;
        }
        finalOptions = validPairs.map((p) => p.st);
        finalCorrect = validPairs.map((p) => p.ans);
      } else {
        const mappedOpts = state.qForm.options
          .map((o, origIdx) => ({ text: o.trim(), origIdx }))
          .filter((item) => item.text !== '');

        if (mappedOpts.length < 2) {
          showToast('Isi minimal 2 pilihan jawaban.', 'error', 'Data Belum Lengkap');
          return;
        }
        finalOptions = mappedOpts.map((m) => m.text);

        if (state.qForm.type === 'PG') {
          const remappedPg = mappedOpts.findIndex((m) => m.origIdx === state.qForm.correctPg);
          if (remappedPg < 0) {
            showToast('Pilih kunci jawaban pada opsi yang terisi.', 'error', 'Kunci Belum Dipilih');
            return;
          }
          finalCorrect = remappedPg;
        } else {
          const remappedMulti = mappedOpts
            .map((m, newIdx) => (state.qForm.correctMulti.includes(m.origIdx) ? newIdx : -1))
            .filter((idx) => idx >= 0);
          if (remappedMulti.length === 0) {
            showToast('Pilih minimal 1 kunci jawaban untuk Pilihan Ganda Kompleks.', 'error', 'Kunci Belum Dipilih');
            return;
          }
          finalCorrect = remappedMulti.sort((a, b) => a - b);
        }
      }

      const wasEditingQ = Boolean(state.qForm.editingId);
      const existingQ = wasEditingQ ? state.questions.find((q) => q.id === state.qForm.editingId) : null;

      await runWithSavingAnimation(
        wasEditingQ
          ? 'Menyimpan perubahan & menganalisis kelayakan soal TKA...'
          : 'Menyimpan butir soal & menjalankan analisis syarat TKA...',
        async () => {
          const analysisResult =
            state.qForm.analysisPreview ||
            (await runTkaQualityAnalysis({
              subject: ws.subject,
              tpCode,
              tpDesc: selectedTp?.description || 'Tujuan Pembelajaran Terkait',
              type: state.qForm.type,
              questionText: state.qForm.text.trim(),
              options: finalOptions,
            }));

          await saveRecordUnified('questions', state.qForm.editingId, {
            teacherId: ws.id,
            teacherToken: ws.token,
            tpId: selectedTp ? selectedTp.id : '',
            tpCode,
            type: state.qForm.type,
            questionText: state.qForm.text.trim(),
            stimulusImage: String(state.qForm.stimulusImage || '').trim(),
            stimulusCaption: String(state.qForm.stimulusCaption || '').trim(),
            optionsJson: JSON.stringify(finalOptions),
            correctAnswerJson: JSON.stringify(finalCorrect),
            weight: Number(state.qForm.weight) || 20,
            order: existingQ?.order || getNextQuestionOrder(ws),
            analysisJson: JSON.stringify(analysisResult),
            createdAt: existingQ?.createdAt || new Date().toISOString(),
          });

          if (!wasEditingQ) {
            const totalWsQuestions = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
            const latestWs = state.teachers.find((t) => t.id === ws.id) || ws;
            await saveRecordUnified('teachers', latestWs.id, {
              ...latestWs,
              targetQuestionCount: totalWsQuestions,
            });
            state.examQuestionCountInput = totalWsQuestions;
          }

          resetQuestionForm();
        },
        wasEditingQ
          ? 'Perubahan butir soal & analisis TKA berhasil disimpan!'
          : 'Butir soal TKA baru & hasil analisis kelayakan berhasil disimpan!'
      );
      renderApp();
    }

    function handleDeleteQuestion(qId) {
      const qItem = state.questions.find((q) => q.id === qId);
      if (!qItem) return;
      openConfirmModal({
        title: 'Hapus Butir Soal TKA?',
        message: `Soal "${(qItem.questionText || '').slice(0, 60)}..." akan dihapus permanen dari bank soal.`,
        confirmText: 'Ya, Hapus Soal',

    async function handleAddTeacher(e) {
      e.preventDefault();
      const name = state.teacherForm.name.trim();
      const subject = state.teacherForm.subject.trim();
      const username = state.teacherForm.username.trim().toLowerCase();
      const password = state.teacherForm.password.trim();

      if (!name || !subject || !username || !password) {
        showToast('Semua kolom (Nama Guru, Nama Mapel, Username, Password) wajib diisi.', 'error', 'Data Belum Lengkap');
        return;
      }

      const duplicateUser = state.teachers.some(
        (t) => (t.username || '').toLowerCase() === username && t.id !== state.teacherForm.editingId
      );
      if (duplicateUser) {
        showToast(`Username "${username}" sudah digunakan. Gunakan username lain.`, 'error', 'Username Duplikat');
        return;
      }

      if (state.teacherForm.editingId) {
        const existingTeacher = state.teachers.find((t) => t.id === state.teacherForm.editingId);
        await runWithSavingAnimation(
          `Menyimpan perubahan data akun ${name}...`,
          async () => {
            await saveRecordUnified('teachers', state.teacherForm.editingId, {
              ...(existingTeacher || {}),
              name,
              subject,
              username,
              password,
            });
            resetTeacherForm();
          },
          `Perubahan akun guru ${name} berhasil disimpan!`
        );
        renderApp();
        return;
      }

      const existingTokens = state.teachers.map((t) => t.token);
      const uniqueToken = generateUniqueToken(existingTokens, subject);
      const sourceRegId = state.teacherForm.sourceRegistrationId;
      let removedFromQueue = false;

      await runWithSavingAnimation(
        `Menyimpan akun guru baru ${name}...`,
        async () => {
          const newTeacherId = await saveRecordUnified('teachers', null, {
            name,
            subject,
            username,
            password,
            token: uniqueToken,
            role: 'guru',
            proktorCode: `G-${uniqueToken}-26`,
            durationMinutes: 60,
            targetQuestionCount: 5,
            examOpen: true,
            createdAt: new Date().toISOString(),
          });

          const matchedRegs = (state.teacherRegistrations || []).filter(
            (r) =>
              (sourceRegId && r.id === sourceRegId) ||
              String(r.username || '').trim().toLowerCase() === username
          );

          if (matchedRegs.length > 0) {
            const matchedIds = new Set(matchedRegs.map((r) => r.id));
            state.teacherRegistrations = (state.teacherRegistrations || []).filter(
              (r) => !matchedIds.has(r.id)
            );
            saveLocalBackupDb();
            for (const regItem of matchedRegs) {
              await postToSpreadsheet({ action: 'delete', table: 'registrations', id: regItem.id });
            }
            removedFromQueue = true;
          }

          const currentWs = state.teachers.find((t) => t.id === state.selectedWorkspaceTeacherId && t.role === 'guru');
          if (!currentWs) {
            state.selectedWorkspaceTeacherId = newTeacherId;
          }
          resetTeacherForm();
        },
        removedFromQueue
          ? `Akun Guru ${name} berhasil disimpan (Token: ${uniqueToken}) & otomatis dihapus dari antrean pendaftaran!`
          : `Akun Guru ${name} berhasil disimpan dengan Token Unik: ${uniqueToken}`
      );
      renderApp();
    }

    function getFilteredRekapSessions() {
      const cur = getCurrentTeacher();
      if (!cur) return [];
      const cleanSessions = deduplicateSessionsList(state.sessions);
      let base = cur.role === 'guru' ? cleanSessions.filter((s) => s.teacherId === cur.id) : cleanSessions;

      if (cur.role === 'proktor' && state.rekapFilter.teacherId !== 'ALL') {
        base = base.filter((s) => s.teacherId === state.rekapFilter.teacherId);
      }

      return base.filter((s) => {
        const q = state.rekapFilter.search.trim().toLowerCase();
        const matchQuery =
          !q ||
          (s.studentName || '').toLowerCase().includes(q) ||
          (s.nisn || '').toLowerCase().includes(q) ||
          (s.studentClass || '').toLowerCase().includes(q) ||
          (s.subject || '').toLowerCase().includes(q);

        const matchStatus =
          state.rekapFilter.status === 'ALL' ||
          (state.rekapFilter.status === 'TUNTAS' && s.status === 'selesai' && s.passed) ||
          (state.rekapFilter.status === 'BELUM' && s.status === 'selesai' && !s.passed);

        return matchQuery && matchStatus;
      });
    }

    function handleExportCsv() {
      const list = getFilteredRekapSessions();
      if (list.length === 0) {
        showToast('Tidak ada data nilai untuk diekspor.', 'error');
        return;
      }

      const headers = [
        'No',
        'Nama Siswa',
        'NISN / Username',
        'Kelas',
        'Mata Pelajaran',
        'Guru Pengampu',
        'Token Digunakan',
        'Status Pengerjaan',
        'Waktu Selesai',
        'Skor Akhir (0-100)',
        'Predikat Ketuntasan',
        'Rincian Ketercapaian TP',
      ];

      const rows = list.map((s, idx) => {
        const tpText = (s.tpBreakdown || [])
          .map((tp) => `${tp.tpCode}: ${tp.score}% (${tp.passed ? 'Tuntas' : 'Belum'})`)
          .join(' | ');
        return [
          idx + 1,
          `"${(s.studentName || '').replace(/"/g, '""')}"`,
          `"${(s.nisn || '').replace(/"/g, '""')}"`,
          `"${(s.studentClass || '').replace(/"/g, '""')}"`,
          `"${(s.subject || '').replace(/"/g, '""')}"`,
          `"${(s.teacherName || '').replace(/"/g, '""')}"`,
          `"${s.tokenUsed || ''}"`,
          s.status === 'selesai' ? 'Selesai' : 'Sedang Mengerjakan',
          `"${formatWaktuID(s.finishedAt)}"`,
          s.status === 'selesai' ? s.score : 0,
          s.status === 'selesai' ? (s.passed ? 'Tuntas' : 'Belum Tuntas') : 'Proses',
          `"${tpText}"`,
        ].join(',');
      });

      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `Rekap_Nilai_TKA_2026_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('File Rekap Nilai CSV/Excel berhasil diunduh!');
    }

    function renderStudentExamView() {
      const ss = state.studentSession;
      if (!ss.profile || !ss.teacher || ss.questions.length === 0) return renderLoginView();

      const totalQ = ss.questions.length;
      const currentQ = ss.questions[ss.currentQIndex] || ss.questions[0];
      const answeredCount = ss.questions.filter(isQuestionAnswered).length;
      const isLast = ss.currentQIndex === totalQ - 1;
      const isDoubt = Boolean(ss.doubtFlags[currentQ.id]);

      const fontSizeClass =
        ss.fontScale === 'sm'
          ? 'text-xs sm:text-sm'
          : ss.fontScale === 'lg'
          ? 'text-base sm:text-lg'
          : 'text-sm sm:text-base';

      const timerDanger = ss.remainingSeconds <= 300;
      const vCount = Number(ss.violationCount) || 0;
      const maxV = Number(ss.maxViolations) || 3;

      let questionBodyHtml = '';
      if (currentQ.type === 'PG') {
        const selectedOpt = ss.answers[currentQ.id];
        questionBodyHtml = `
          <div class="space-y-2.5">
            ${(currentQ.options || [])
              .map((opt, idx) => {
                const isSelected = selectedOpt === idx;
                return `
                  <button type="button" onclick="selectPgOption('${currentQ.id}', ${idx})" class="w-full text-left p-3.5 rounded-xl border transition-all flex items-start gap-3 ${
                    isSelected
                      ? 'border-[#0095ff] bg-sky-50/90 ring-2 ring-[#0095ff]/30 shadow-xs'
                      : 'border-slate-200 hover:border-sky-300 hover:bg-slate-50'
                  }">

                      isSelected ? 'bg-[#0095ff] text-white' : 'bg-slate-100 text-slate-700'
                    }">${OPTION_LETTERS[idx]}</span>
                    <span class="leading-relaxed text-slate-800 ${fontSizeClass}">${renderMathHtml(opt, false)}</span>
                  </button>
                `;
              })
              .join('')}
          </div>
        `;
      } else if (currentQ.type === 'PG_KOMPLEKS') {
        const selectedList = Array.isArray(ss.answers[currentQ.id]) ? ss.answers[currentQ.id] : [];
        questionBodyHtml = `
          <div class="space-y-2.5">

                    isChecked

                  .map((stmt, sIdx) => {
                    const val = userMap[sIdx];
                    return `
                      <tr class="hover:bg-slate-50/70">
                        <td class="p-3 text-slate-800 leading-relaxed ${fontSizeClass}">${renderMathHtml(stmt, false)}</td>

      const navButtonsHtml = ss.questions

        .join('');

      const qTypeBadge =
        currentQ.type === 'PG'

             <div class="p-5 sm:p-6 space-y-5">
            ${(() => {
              let cAn = currentQ.analysis || {};
              if ((!cAn || !cAn.stimulusText) && typeof currentQ.analysisJson === 'string' && currentQ.analysisJson) {
                try { cAn = { ...cAn, ...JSON.parse(currentQ.analysisJson) }; } catch (e) {}
              }
              const sText = currentQ.stimulusText || cAn.stimulusText || '';
              if (!sText) return '';
              const sTitle = currentQ.stimulusTitle || cAn.stimulusTitle || '';
              const sGroupId = currentQ.stimulusGroupId || cAn.stimulusGroupId || '';
              let startIdx = ss.currentQIndex;
              let endIdx = ss.currentQIndex;
              if (sGroupId) {
                while (startIdx - 1 >= 0) {
                  const pQ = ss.questions[startIdx - 1];
                  let pAn = pQ.analysis || {};
                  if (!pAn.stimulusGroupId && typeof pQ.analysisJson === 'string') {
                    try { pAn = { ...pAn, ...JSON.parse(pQ.analysisJson) }; } catch (e) {}
                  }
                  if ((pQ.stimulusGroupId || pAn.stimulusGroupId || '') === sGroupId) startIdx--;
                  else break;
                }
                while (endIdx + 1 < ss.questions.length) {
                  const nQ = ss.questions[endIdx + 1];
                  let nAn = nQ.analysis || {};
                  if (!nAn.stimulusGroupId && typeof nQ.analysisJson === 'string') {
                    try { nAn = { ...nAn, ...JSON.parse(nQ.analysisJson) }; } catch (e) {}
                  }
                  if ((nQ.stimulusGroupId || nAn.stimulusGroupId || '') === sGroupId) endIdx++;
                  else break;
                }
              }
              const rangeText = endIdx > startIdx ? `Digunakan untuk Soal No. ${startIdx + 1} s.d. ${endIdx + 1}` : `Naskah Stimulus Soal No. ${startIdx + 1}`;

                  <div class="leading-relaxed text-slate-800 whitespace-pre-line ${fontSizeClass}">

            ${

                    <div class="flex justify-center">
                      <img src="${escapeHtml(currentQ.stimulusImage)}" alt="Gambar Stimulus Soal" onclick="state.imageZoomModal={src:this.src,caption:${JSON.stringify(currentQ.stimulusCaption || 'Gambar Stimulus Soal No. ' + (ss.currentQIndex + 1))}};renderApp();" class="max-h-72 w-auto object-contain rounded-lg border border-slate-200 bg-white cursor-zoom-in shadow-sm" title="Klik untuk memperbesar gambar" />
                    </div>
                    <div class="flex items-center justify-between gap-2 text-[11px] text-slate-500">
                      <span>${currentQ.stimulusCaption ? escapeHtml(currentQ.stimulusCaption) : 'Gambar Stimulus Soal'}</span>
                      <button type="button" onclick="state.imageZoomModal={src:${JSON.stringify(currentQ.stimulusImage)},caption:${JSON.stringify(currentQ.stimulusCaption || 'Gambar Stimulus Soal No. ' + (ss.currentQIndex + 1))}};renderApp();" class="px-2 py-0.5 rounded bg-sky-100 text-[#002b7a] font-bold hover:bg-sky-200">Perbesar Gambar</button>
                    </div>
                  </div>
                `
                : ''
            }
            <div class="leading-relaxed text-slate-900 font-medium ${fontSizeClass}">
              ${renderMathHtml(currentQ.questionText, true)}
            </div>

                ${questionBodyHtml}
              </div>

              <div class="px-5 py-4 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2">
                <button type="button" ${ss.currentQIndex === 0 ? 'disabled' : ''} onclick="state.studentSession.currentQIndex=Math.max(0, state.studentSession.currentQIndex-1);saveStudentExamDraft();renderApp()" class="px-4 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 disabled:opacity-40 text-slate-800 text-xs font-bold">
                  ← Sebelumnya
                </button>

                <button type="button" onclick="toggleDoubtFlag('${currentQ.id}')" class="px-4 py-2.5 rounded-xl border text-xs font-extrabold transition-all ${
                  isDoubt
                    ? 'bg-amber-400 border-amber-500 text-slate-950'
                    : 'bg-amber-50 border-amber-300 text-amber-900 hover:bg-amber-100'
                }">
                  ${isDoubt ? '★ Ditandai Ragu-Ragu' : '☆ Tandai Ragu-Ragu'}
                </button>

                ${
                  isLast
                    ? `<button type="button" ${state.isSubmittingExam ? 'disabled' : ''} onclick="openSubmitExamConfirm()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-sm">
                        ${state.isSubmittingExam ? 'Mengirim Jawaban...' : 'Selesai & Kumpulkan ✓'}
                      </button>`
                    : `<button type="button" onclick="state.studentSession.currentQIndex=Math.min(${totalQ - 1}, state.studentSession.currentQIndex+1);saveStudentExamDraft();renderApp()" class="px-5 py-2.5 rounded-xl bg-[#0095ff] hover:bg-[#0288d1] text-white text-xs font-extrabold shadow-sm">
                        Selanjutnya →
                      </button>`
                }
              </div>
            </section>

            <aside class="lg:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
              <div class="flex items-center justify-between">
                <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-600">Navigasi Nomor Soal</h2>
                <span class="text-xs font-bold text-[#002b7a]">${answeredCount}/${totalQ} Dijawab</span>
              </div>

              <div class="grid grid-cols-5 gap-2">
                ${navButtonsHtml}
              </div>

              <div class="pt-2 border-t border-slate-100 grid grid-cols-3 gap-1.5 text-[11px] text-slate-600">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-600 inline-block"></span>Dijawab</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-amber-400 inline-block"></span>Ragu</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-slate-200 border border-slate-300 inline-block"></span>Kosong</span>
              </div>

              <button type="button" ${state.isSubmittingExam ? 'disabled' : ''} onclick="openSubmitExamConfirm()" class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs shadow-md transition-all">
                ${state.isSubmittingExam ? 'Menyimpan Hasil...' : 'Kumpulkan Jawaban Tes TKA'}
              </button>
            </aside>
          </main>
        </div>
      `;
    }

    function renderProktorDashboardView() {
      const currentTeacher = getCurrentTeacher();
      const wsTeacher = getWorkspaceTeacher();
      if (!currentTeacher || !wsTeacher) return renderLoginView();

      const isMainProktor = currentTeacher.role === 'proktor';
      const activeTab =
        !isMainProktor && (state.proktorTab === 'guru' || state.proktorTab === 'spreadsheet')
          ? 'beranda'
          : state.proktorTab || 'beranda';
      const activeSubTab = state.tpSubTab || 'tp_generator';
      const shareAppUrl = getUnifiedOneLinkUrl();

      const wsTps = state.tps.filter((t) => isOwnedByTeacher(t, wsTeacher));
      const wsBlueprints = state.blueprints
        .filter((b) => isOwnedByTeacher(b, wsTeacher))
        .sort((a, b) => (a.questionNumber || 0) - (b.questionNumber || 0));
      const wsQuestions = state.questions
        .filter((q) => isOwnedByTeacher(q, wsTeacher))
        .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));

      const totalWeightSum = wsQuestions.reduce((sum, q) => sum + (Number(q.weight) || 0), 0);

      const pendingRegistrations = Array.isArray(state.teacherRegistrations)
        ? state.teacherRegistrations
        : [];
      const guruList = state.teachers.filter((t) => t.role === 'guru');

      const navItems = [
        { id: 'beranda', label: 'Beranda Utama', badge: '' },
        { id: 'tp_soal', label: 'TP, Kisi-Kisi & Soal', badge: `${wsQuestions.length}` },
        { id: 'rekap', label: 'Rekap Nilai Siswa', badge: `${deduplicateSessionsList(state.sessions).length}` },
        ...(isMainProktor
          ? [
              {
                id: 'guru',
                label: 'Manajemen Guru',
                badge:
                  pendingRegistrations.length > 0
                    ? `${pendingRegistrations.length} Baru`
                    : `${guruList.length}`,
              },
              { id: 'spreadsheet', label: 'Spreadsheet & 1 Link', badge: '' },
            ]
          : []),
        { id: 'regulasi', label: 'Regulasi TKA 2026', badge: '' },
      ];

      const renderSidebarContent = () => `
        <div class="p-5 border-b border-white/15 flex items-center gap-3">
          ${renderLogoSvg(40)}
          <div class="min-w-0">
            <h1 class="text-sm font-extrabold text-white truncate">Aplikasi Penunjang TKA</h1>
            <p class="text-[11px] text-sky-200 truncate">CBT Kurikulum 2026</p>
          </div>
        </div>

        <div class="p-4 border-b border-white/10">
          <div class="p-3 rounded-xl bg-white/10 space-y-1">
            <span class="px-2 py-0.5 rounded bg-sky-500/30 text-sky-200 text-[10px] font-bold uppercase">
              ${isMainProktor ? 'Proktor Utama' : 'Guru Mata Pelajaran'}
            </span>
            <p class="text-xs font-extrabold text-white truncate pt-0.5">${escapeHtml(currentTeacher.name)}</p>
            <p class="text-[11px] text-sky-200 truncate">${escapeHtml(currentTeacher.subject)}</p>
          </div>
        </div>

        <nav class="flex-1 p-3 space-y-1 overflow-y-auto tka-left-sidebar-scroll">
          ${navItems
            .map((item) => {
              const isAct = activeTab === item.id;
              return `
                <button type="button" onclick="state.proktorTab='${item.id}';state.mobileMenuOpen=false;renderApp()" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                  isAct
                    ? 'bg-[#0095ff] text-white shadow-md'
                    : 'text-sky-100 hover:bg-white/10 hover:text-white'
                }">
                  <span>${escapeHtml(item.label)}</span>
                  ${
                    item.badge
                      ? `<span class="px-2 py-0.5 rounded-full text-[10px] ${
                          isAct ? 'bg-white/25 text-white' : 'bg-white/10 text-sky-200'
                        }">${escapeHtml(item.badge)}</span>`
                      : ''
                  }
                </button>
              `;
            })
            .join('')}
        </nav>

        <div class="p-4 border-t border-white/15 space-y-2">
          <button type="button" onclick="fetchFromSpreadsheet('', false)" class="w-full py-2 px-3 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-bold transition-all">
            ↻ Sinkronkan Data
          </button>
          <button type="button" onclick="handleProktorLogout()" class="w-full py-2 px-3 rounded-xl bg-rose-600/90 hover:bg-rose-600 text-white text-xs font-bold transition-all">
            Keluar / Logout
          </button>
        </div>
      `;

      let mainContentHtml = '';

      if (activeTab === 'beranda') {
        const cleanAllSessions = deduplicateSessionsList(state.sessions);
        const scopedSessions = isMainProktor
          ? cleanAllSessions
          : cleanAllSessions.filter((s) => s.teacherId === currentTeacher.id);
        const finishedSessions = scopedSessions.filter((s) => s.status === 'selesai');
        const passedCount = finishedSessions.filter((s) => s.passed).length;
        const failedCount = finishedSessions.length - passedCount;
        const avgScore =
          finishedSessions.length > 0
            ? Math.round(finishedSessions.reduce((a, b) => a + (Number(b.score) || 0), 0) / finishedSessions.length)

                  </div>
                  <p class="text-[11px] text-slate-500">
                    Status saat ini: <strong>${storedGeminiKey ? 'API Key Gemini AI Aktif (Tersinkronisasi ke Semua Guru)' : 'Belum Dipasang (Menggunakan Templat Standar BSKAP)'}</strong>.
                  </p>
                </div>
              </div>
            </div>
          </div>
        `;
      } else {
        // Regulasi TKA 2026
        mainContentHtml = `
          <div class="space-y-5 text-xs">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${TKA_REGULATIONS_2026.map(
                (reg) => `
                <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-2">
                  <span class="px-2.5 py-1 rounded-lg bg-sky-50 text-[#002b7a] font-extrabold">${escapeHtml(reg.code)}</span>
                  <h4 class="text-sm font-extrabold text-slate-900 pt-1">${escapeHtml(reg.title)}</h4>
                  <p class="text-slate-600 leading-relaxed">${escapeHtml(reg.summary)}</p>
                </div>
              `
              ).join('')}
            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4">
              <h3 class="text-sm font-extrabold text-[#002b7a]">Kaidah Penulisan &amp; Telaah Kritis Butir Soal TKA 2026</h3>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${TKA_WRITING_STANDARDS.map(
                  (std) => `
                  <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                    <h4 class="font-extrabold text-slate-900">${escapeHtml(std.aspect)}</h4>
                    <ul class="list-disc pl-4 space-y-1.5 text-slate-600 leading-relaxed">
                      ${std.criteria.map((c) => `<li>${escapeHtml(c)}</li>`).join('')}
                    </ul>
                  </div>
                `
                ).join('')}
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="min-h-screen bg-[#f0f4f8] flex text-slate-800">
          <!-- Sidebar Desktop -->
          <aside class="hidden lg:flex lg:flex-col tka-left-sidebar shrink-0 sticky top-0 h-screen">
            ${renderSidebarContent()}
          </aside>

          <!-- Drawer Mobile -->
          ${
            state.mobileMenuOpen
              ? `
              <div class="fixed inset-0 z-50 lg:hidden flex">
                <div class="fixed inset-0 bg-slate-950/60" onclick="state.mobileMenuOpen=false;renderApp()"></div>
                <aside class="relative w-72 max-w-[82vw] tka-left-sidebar flex flex-col h-full z-10 animate-drawer-left">
                  ${renderSidebarContent()}
                </aside>
              </div>
            `
              : ''
          }

          <!-- Area Konten Utama -->
          <div class="flex-1 flex flex-col min-w-0">
            <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3.5 sticky top-0 z-20 flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <button type="button" onclick="state.mobileMenuOpen=true;renderApp()" class="lg:hidden p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-sm">
                  ☰
                </button>
                <div>
                  <h2 class="text-base sm:text-lg font-extrabold text-[#002b7a]">Panel Manajemen Asesmen TKA 2026</h2>
                  <p class="text-[11px] text-slate-500">Workspace Aktif: <strong>${escapeHtml(wsTeacher.subject)}</strong> (${escapeHtml(wsTeacher.name)})</p>
                </div>
              </div>

              ${
                isMainProktor
                  ? `
                  <div class="flex items-center gap-2 text-xs">
                    <span class="text-slate-500 font-semibold hidden sm:inline">Pilih Mapel Guru:</span>
                    <select onchange="state.selectedWorkspaceTeacherId=this.value;const t=getWorkspaceTeacher();if(t){state.examDurationInput=Number(t.durationMinutes)||60;const qc=state.questions.filter(q=>isOwnedByTeacher(q,t)).length;state.examQuestionCountInput=qc>0?Math.min(qc,Number(t.targetQuestionCount)||qc):Number(t.targetQuestionCount)||5;}renderApp()" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-slate-50 font-bold text-[#002b7a]">
                      ${
                        guruList.length === 0
                          ? `<option value="${currentTeacher.id}">Belum ada akun guru (Mode Proktor)</option>`
                          : guruList
                              .map(
                                (g) =>
                                  `<option value="${g.id}" ${wsTeacher.id === g.id ? 'selected' : ''}>${escapeHtml(g.subject)} — ${escapeHtml(g.name)}</option>`
                              )
                              .join('')
                      }
                    </select>
                  </div>
                `
                  : `<span class="px-3 py-1 rounded-full bg-sky-50 border border-sky-200 text-xs font-mono font-extrabold text-[#002b7a]">Token: ${escapeHtml(wsTeacher.token)}</span>`
              }
            </header>

            <main class="flex-1 p-4 sm:p-6 max-w-7xl w-full mx-auto">
              ${mainContentHtml}
              ${renderFooterHtml()}
            </main>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 14. RENDERER UTAMA & EVENT LISTENER GLOBAL (TIMER, ANTI-CURANG, INIT)
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      if (state.currentView === 'student_confirm') {
        root.innerHTML = renderStudentConfirmView();
      } else if (state.currentView === 'student_exam') {
        root.innerHTML = renderStudentExamView();
      } else if (state.currentView === 'student_result') {
        root.innerHTML = renderStudentResultView();
      } else if (state.currentView === 'proktor') {
        root.innerHTML = renderProktorDashboardView();
      } else {
        root.innerHTML = renderLoginView();
      }

      persistActiveViewSession();
      renderModals();
    }

    // Interval Jam Digital & Hitung Mundur Timer Ujian Siswa
    setInterval(() => {
      const clockEl = document.getElementById('live-clock');
      if (clockEl) {
        const now = new Date();
        clockEl.textContent = `${now.toLocaleDateString('id-ID', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
        })} ${now.toLocaleTimeString('id-ID')}`;
      }

      if (state.currentView === 'student_exam' && !state.isSubmittingExam) {
        const ss = state.studentSession;
        if (ss.remainingSeconds > 0) {
          ss.remainingSeconds -= 1;
          if (ss.remainingSeconds % 10 === 0) {
            saveStudentExamDraft();
          }
          const timerEl = document.getElementById('exam-timer-text');
          if (timerEl) timerEl.textContent = formatCountdown(ss.remainingSeconds);
          if (ss.remainingSeconds === 300) {
            showToast('Sisa waktu pengerjaan tinggal 5 menit lagi!', 'warning', 'Peringatan Waktu');
          }
        } else {
          handleFinishExam(true, false);
        }
      }
    }, 1000);

    // Mencegah deteksi pelanggaran palsu saat halaman di-reload/ditutup
    window.addEventListener('beforeunload', () => {
      isPageUnloading = true;
      persistActiveViewSession();
      if (state.currentView === 'student_exam') {
        saveStudentExamDraft();
      }
    });

    window.addEventListener('pagehide', () => {
      isPageUnloading = true;
    });

    // Pengawasan Anti-Curang Saat Ujian Siswa Berlangsung
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && state.currentView === 'student_exam' && !isPageUnloading) {
        registerStudentViolation('Berpindah tab atau meminimalkan jendela browser');
      }
    });

    window.addEventListener('blur', () => {
      if (state.currentView === 'student_exam' && !state.studentSession.isEnteringFullscreen && !isPageUnloading) {
        registerStudentViolation('Fokus layar berpindah ke aplikasi/jendela lain');
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (
        state.currentView === 'student_exam' &&
        state.studentSession.hasEnteredFullscreen &&
        !document.fullscreenElement &&
        !state.isSubmittingExam &&
        !isPageUnloading
      ) {
        registerStudentViolation('Keluar dari mode layar penuh (Fullscreen)');
      }
    });

    // Inisialisasi Aplikasi Saat Halaman Dimuat
    (function initApp() {
      loadLocalBackupDb();
      state.geminiApiKeyInput = getStoredGeminiApiKey();

      // Pulihkan halaman & sesi aktif terakhir jika pengguna melakukan Reload (F5 / Ctrl+R)
      const restoredActiveView = restoreActiveViewSessionOnReload();

      if (!restoredActiveView) {
        // Cek apakah ada draf ujian siswa yang belum selesai
        state.savedDraftPrompt = loadStudentExamDraft();

        // Cek parameter URL ?token=XXXXXX agar link langsung mengisi token siswa
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const paramToken = String(urlParams.get('token') || '').trim().toUpperCase();
          if (paramToken) {
            state.loginRoleTab = 'siswa';
            state.loginForm.studentToken = paramToken;
          }
        } catch {}
      }

      renderApp();
      if (isSpreadsheetMode()) {
        fetchFromSpreadsheet(state.spreadsheetApiUrl, true);
      }
    })();
  </script>
</body>
</html>
